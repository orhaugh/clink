[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clink-mcp"
version = "0.1.0"
description = "An MCP server over clink's diagnostic surface: state inspection, capture and replay, lineage, queryable state, lint and EXPLAIN, read-only"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ross Haugh", email = "orhaugh@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.scripts]
clink-mcp = "clink_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/orhaugh/clink"
Documentation = "https://orhaugh.github.io/clink/guides/diagnosing-a-pipeline-with-an-agent/"

[tool.setuptools.packages.find]
include = ["clink_mcp*"]
