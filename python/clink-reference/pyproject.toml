[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clink-reference"
version = "0.2.0"
description = "Compute an independent reference result for a clink checkpoint's scope: read its exact Kafka range, apply your own transformation or tumbling window, and write the artifact clink incident-reconcile --reference audits"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ross Haugh", email = "orhaugh@gmail.com" }]
requires-python = ">=3.10"
# The Kafka reader only; the scope, canonical cells and the artifact need none.
dependencies = ["confluent-kafka>=2.6,<3"]

[project.urls]
Repository = "https://github.com/orhaugh/clink"
Documentation = "https://orhaugh.github.io/clink/internals/incident-verification/#independent-reference-audit"

[tool.setuptools.packages.find]
include = ["clink_reference*"]
