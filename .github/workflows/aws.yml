name: aws

# The AWS connectors' gates, one build for all of them, each against LocalStack
# (docker/integration-services.yml's localstack service) and a model of the
# service, or for raw S3 objects against SILO. Nothing here runs against AWS.
#
# scripts/kinesis-live.sh, the Kinesis source: its deterministic cases against a
# model of the service (ownership, discovery, split and merge lineage, restores
# at each parent and child transition, latest-mode starts, iterator expiry,
# throttling, transient and permanent failures, retention loss, rescale through
# the runtime's file:// and rocksdb:// restores, cancellation, bounded state),
# the live ones (a split and a merge while the source reads, a uniform reshard
# under two subtasks, latest mode restored before its first record, a missing
# and a recreated stream), and the recovery cells, a coordinator and two workers
# reading the emulator's stream into the file 2PC sink with a worker killed while
# records are in flight and the stream resharded under the job. Its second phase
# is the Kinesis sink's, its evidence kept apart under sink/: the partition-key
# rules, the response judge and the sink's write path against a model of
# PutRecords (limits, partial failures resent with their keys, retry bounds,
# ambiguous responses, permanent errors, a lost reply, cancellation, the failed
# state, replay), the SDK path against an in-process stand-in for PutRecords,
# the live cases read back by a client of their own, and the recovery cells, a
# worker killed after a store no checkpoint covers or before a send, and a SQL
# job, each output stream checked for every record at least once with its key.
#
# scripts/dynamodb-live.sh, the DynamoDB sink: item identity, the record checks
# and DynamoDB's size rules, and the sink's write path against a model of
# DescribeTable and BatchWriteItem (partial writes, retry bounds, inconsistent
# responses, permanent errors, a lost reply, cancellation, the failed state and a
# restart); the live cases, read back from the emulator item by item; and the
# recovery cells, a worker parked at the sink's own fault points with writes no
# checkpoint covers and killed, each table checked against the last record
# written for every item.
#
# scripts/firehose-live.sh, the Firehose sink: the request accounting against the
# SDK's own JSON, the response judge, and the sink's write path against a model
# of PutRecordBatch (record and request limits, partial acceptance, retry bounds,
# responses that do not account for their request, permanent errors, a lost
# reply, cancellation, the failed state); the live cases, reading the delivery
# stream's S3 destination back record by record; and the recovery cells, a
# worker killed after an acceptance no checkpoint covers or before a send, each
# bucket checked for every record at least once and nothing else.
#
# scripts/s3-live.sh, the raw S3 objects: the text sink, the multipart 2PC sink
# and the C++ source against SILO, a fork of the MinIO server pinned by digest:
# every page of a listing, the source's restores by key, the text sink's parts
# per subtask and after a restore, and the 2PC sink's commit, recovery, abort and
# contract suite. The 2PC sink's cluster-level suite runs in docker-suites.
#
# A live test skips when its endpoint or binary is missing and gtest counts that
# as a pass, so each gate fails on any skip and on any required suite that did
# not run. Each gate runs even when an earlier one fails.
#
# The scripts run on the runner, where they start and remove the emulator with
# Docker; the test binaries run inside the toolchain image through PIN_RUNNER,
# on the runner's network.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: aws-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: The Kinesis source and the Kinesis, DynamoDB and Firehose sinks hold their contracts against the emulator and the models
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build:main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what is under test
        run: |
          echo "commit under test: $(git rev-parse HEAD)"
          docker pull -q "${TOOLCHAIN}"
          df -h /
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-aws-${{ github.run_id }}
          restore-keys: |
            ccache-aws-
            ccache-kinesis-
      # CLINK_WITH_AWS=ON and CLINK_WITH_AWS_S3=ON, not AUTO: an SDK missing from
      # the image fails the configure rather than leaving a gate without its
      # binaries. Debug without DWARF and stripped, as the build job builds.
      - name: Build the AWS and S3 tests, the recovery cells, the node binary and the SQL submitter
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ccache"
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${RUNNER_TEMP}/ccache:/root/.ccache" \
            -e CLINK_DEPS_PREFIX=/usr/local -e CCACHE_DIR=/root/.ccache -e CCACHE_MAXSIZE=1500M \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${TOOLCHAIN}" bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends ccache >/dev/null
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCLINK_BUILD_TESTS=ON -DCLINK_BUILD_SQL=ON \
                -DCLINK_INTEGRATION_TESTS=ON -DCLINK_WITH_AWS=ON -DCLINK_WITH_AWS_S3=ON \
                -DCMAKE_C_FLAGS_DEBUG=-g0 -DCMAKE_CXX_FLAGS_DEBUG=-g0 -DCMAKE_EXE_LINKER_FLAGS=-s \
                -DCMAKE_SHARED_LINKER_FLAGS=-s
              cmake --build build --target clink_aws_tests clink_s3_tests clink_integration_tests \
                clink_node clink_submit_sql -j "$(( $(nproc) / 2 + 1 ))"
              ccache -s | tail -3'
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-aws-${{ github.run_id }}
      - name: Run the Kinesis gate, the source's phase and the sink's
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/kinesis-live-reports"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_KINESIS_TEST_ENDPOINT -e CLINK_KINESIS_RECOVERY_LOG_DIR \
            -e CLINK_KINESIS_SINK_RECOVERY_LOG_DIR \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_REGION \
            -e AWS_EC2_METADATA_DISABLED \
            ${TOOLCHAIN}"
          scripts/kinesis-live.sh build 2>&1 | tee "${RUNNER_TEMP}/kinesis-gate.log"
      - name: Run the DynamoDB gate
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/dynamodb-live-reports"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_DYNAMODB_TEST_ENDPOINT -e CLINK_DYNAMODB_RECOVERY_LOG_DIR \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_REGION \
            -e AWS_EC2_METADATA_DISABLED \
            ${TOOLCHAIN}"
          scripts/dynamodb-live.sh build 2>&1 | tee "${RUNNER_TEMP}/dynamodb-gate.log"
      - name: Run the Firehose gate
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/firehose-live-reports"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_FIREHOSE_TEST_ENDPOINT -e CLINK_FIREHOSE_RECOVERY_LOG_DIR \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_REGION \
            -e AWS_EC2_METADATA_DISABLED \
            ${TOOLCHAIN}"
          scripts/firehose-live.sh build 2>&1 | tee "${RUNNER_TEMP}/firehose-gate.log"
      - name: Run the raw S3 gate
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/s3-live-reports"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_S3_TEST_ENDPOINT -e CLINK_S3_TEST_BUCKET \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_REGION \
            -e AWS_EC2_METADATA_DISABLED \
            ${TOOLCHAIN}"
          scripts/s3-live.sh build 2>&1 | tee "${RUNNER_TEMP}/s3-gate.log"
      - name: Keep the Kinesis reports and the cells' evidence
        # The reports carry every case's result; the gate log and each run's log
        # carry the recovery cells' verdict lines and the fault framework's
        # witness lines; recovery-logs/ holds every cell's coordinator and worker
        # logs; provenance.txt names the commit, the build's configuration and the
        # emulator; sink/ holds the same for the sink's phase. On failure the
        # report directory also holds the emulator's own log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinesis-gate
          path: |
            ${{ runner.temp }}/kinesis-live-reports/**
            ${{ runner.temp }}/kinesis-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Keep the DynamoDB reports and the cells' evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamodb-gate
          path: |
            ${{ runner.temp }}/dynamodb-live-reports/**
            ${{ runner.temp }}/dynamodb-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Keep the Firehose reports and the cells' evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firehose-gate
          path: |
            ${{ runner.temp }}/firehose-live-reports/**
            ${{ runner.temp }}/firehose-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Keep the raw S3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-gate
          path: |
            ${{ runner.temp }}/s3-live-reports/**
            ${{ runner.temp }}/s3-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Upload the harness logs on failure
        # The harness keeps its scratch tree, with every Coordinator and
        # Worker log, when a recovery cell fails.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aws-harness-logs
          path: /tmp/clink_it_*/logs/**
          if-no-files-found: ignore
          retention-days: 14
