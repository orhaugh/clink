name: mongodb

# The MongoDB connector's gate (scripts/mongodb-live.sh): every MongoDB test
# against a single-member replica set of docker/integration-services.yml's
# mongodb service (mongo:7, with enableTestCommands for the failCommand fail
# point): the offline suites; the round trips; the source's recovery contract
# (checkpoints at the per-pass cap, after an idle pass and before the first
# pass, tokens the server cannot resume from, drop and rename, update images);
# the sink's failure cases (keys, the unique index, write concerns, write concern
# errors, dropped connections, a batch stopped part way); the SQL plans,
# refusals and embedded SQL pipelines (connector='mongodb'); and the recovery
# cells, a coordinator and two workers running a change-stream job into MongoDB,
# one of them a SQL job, with a worker killed at the connector's fault points,
# before and after a checkpoint, and the server restarted under the job, each
# verified by reading MongoDB directly. A live test skips when its server or binary is missing and gtest
# counts that as a pass, so the gate fails on any skip and on any required suite
# that did not run.
#
# The script runs on the runner, where it starts and removes the server with
# Docker; the test binaries run inside the toolchain image through PIN_RUNNER,
# on the runner's network, with the runner's Docker daemon reachable through its
# socket and a pinned static CLI, which the outage cell uses.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mongodb-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_CLI_VERSION: 29.8.2
  DOCKER_CLI_SHA256: 995d1ef289677f74fd58d8d2c35727b6a4ee389c69db8638a3e42d0487aa5b0f

jobs:
  live:
    name: The MongoDB source and sink hold their contracts against a replica set
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build:main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what is under test
        run: |
          echo "commit under test: $(git rev-parse HEAD)"
          docker pull -q "${TOOLCHAIN}"
          df -h /
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mongodb-${{ github.run_id }}
          restore-keys: ccache-mongodb-
      # ON, not AUTO: a driver missing from the image fails the configure rather
      # than leaving the gate without its binary. Debug without DWARF and
      # stripped, as the build job builds.
      - name: Build the MongoDB tests, the recovery cells and the node binaries
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ccache"
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${RUNNER_TEMP}/ccache:/root/.ccache" \
            -e CLINK_DEPS_PREFIX=/usr/local -e CCACHE_DIR=/root/.ccache -e CCACHE_MAXSIZE=1500M \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${TOOLCHAIN}" bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends ccache >/dev/null
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCLINK_BUILD_TESTS=ON -DCLINK_BUILD_SQL=ON \
                -DCLINK_INTEGRATION_TESTS=ON -DCLINK_WITH_MONGODB=ON -DCMAKE_C_FLAGS_DEBUG=-g0 \
                -DCMAKE_CXX_FLAGS_DEBUG=-g0 -DCMAKE_EXE_LINKER_FLAGS=-s -DCMAKE_SHARED_LINKER_FLAGS=-s
              cmake --build build --target clink_mongodb_tests clink_mongodb_sql_tests \
                clink_integration_tests clink_node clink_submit_sql -j "$(( $(nproc) / 2 + 1 ))"
              ccache -s | tail -3'
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mongodb-${{ github.run_id }}
      - name: Fetch the pinned Docker CLI
        # The toolchain image carries no Docker client; the outage cell drives
        # the runner's daemon with this one, verified against its pin.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker.tgz" \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz"
          echo "${DOCKER_CLI_SHA256}  ${RUNNER_TEMP}/docker.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/docker.tgz" -C "${RUNNER_TEMP}" docker/docker
      - name: Run the gate
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/mongodb-live-reports"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${RUNNER_TEMP}/docker/docker:/usr/local/bin/docker:ro \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_MONGODB_TEST_URI -e CLINK_MONGODB_TEST_CONTAINER \
            -e CLINK_MONGODB_RECOVERY_LOG_DIR \
            ${TOOLCHAIN}"
          scripts/mongodb-live.sh build 2>&1 | tee "${RUNNER_TEMP}/mongodb-gate.log"
      - name: Keep the reports and the cells' evidence
        # The reports carry every case's result; the gate log and each run's log
        # carry the recovery cells' "[mongodb-recovery]" lines and the fault
        # framework's witness lines; recovery-logs/ holds every cell's
        # coordinator and worker logs; provenance.txt names the commit, the
        # build's configuration and the server. On failure the report directory
        # also holds the server's own log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-gate
          path: |
            ${{ runner.temp }}/mongodb-live-reports/**
            ${{ runner.temp }}/mongodb-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Upload the harness logs on failure
        # The harness keeps its scratch tree, with every Coordinator and
        # Worker log, when a recovery cell fails.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-harness-logs
          path: /tmp/clink_it_*/logs/**
          if-no-files-found: ignore
          retention-days: 14
