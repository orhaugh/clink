name: mysql

# The MySQL connector's gate (scripts/mysql-live.sh), in two phases against
# pinned MySQL 8.0 and 8.4 servers, one server after the other.
#
# The change stream (cdc): its checkpoint row, event and statement classes,
# event processing and row decoding, the snapshot and the polling source; its
# round trips and contract (decode failures under both policies, schema changes
# under both row-metadata modes, restores from rotated, purged, corrupt and
# foreign coordinates, large transactions across checkpoints, the snapshot's
# locks and concurrent writes); and its recovery cells, a coordinator and two
# workers reading the binlog into the file two-phase-commit sink, one of them a
# SQL job, with a worker killed inside the initial snapshot and inside a large
# transaction.
#
# The sinks (sink): the record reader, values, statements and bounds, the
# changelog buffer, the table checks and the failure state; their contract
# against the server (keys the table treats as one, refused tables and values,
# exact values, transactions, packet limits, lock waits, a cancel, a lost
# COMMIT reply); and their recovery cells, a coordinator and two workers
# polling a feed into each sink, one of them a SQL job at parallelism 2, with a
# worker killed before a flush's COMMIT and after it.
#
# Every cell is verified through the mysql client in the server's container. A
# live test skips when its server or binary is missing and gtest counts that as
# a pass, so the gate fails on any skip, on any required suite that did not run
# in full, and on a case outside both phases.
#
# The script runs on the runner, where it starts and removes each server with
# Docker; the test binaries run inside the toolchain image through PIN_RUNNER,
# on the runner's network, with the runner's Docker daemon reachable through its
# socket and a pinned static CLI, which the recovery cells' verifier uses.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mysql-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_CLI_VERSION: 29.8.2
  DOCKER_CLI_SHA256: 995d1ef289677f74fd58d8d2c35727b6a4ee389c69db8638a3e42d0487aa5b0f

jobs:
  live:
    name: The MySQL change stream and sinks hold their contracts against MySQL 8.0 and 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build:main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what is under test
        run: |
          echo "commit under test: $(git rev-parse HEAD)"
          docker pull -q "${TOOLCHAIN}"
          df -h /
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mysql-${{ github.run_id }}
          restore-keys: ccache-mysql-
      # ON, not AUTO: a client library missing from the image fails the
      # configure rather than leaving the gate without its binary. Debug without
      # DWARF and stripped, as the build job builds.
      - name: Build the MySQL tests, the recovery cells and the node binaries
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ccache"
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${RUNNER_TEMP}/ccache:/root/.ccache" \
            -e CLINK_DEPS_PREFIX=/usr/local -e CCACHE_DIR=/root/.ccache -e CCACHE_MAXSIZE=1500M \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${TOOLCHAIN}" bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends ccache >/dev/null
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCLINK_BUILD_TESTS=ON -DCLINK_BUILD_SQL=ON \
                -DCLINK_INTEGRATION_TESTS=ON -DCLINK_WITH_MYSQL=ON -DCMAKE_C_FLAGS_DEBUG=-g0 \
                -DCMAKE_CXX_FLAGS_DEBUG=-g0 -DCMAKE_EXE_LINKER_FLAGS=-s -DCMAKE_SHARED_LINKER_FLAGS=-s
              cmake --build build --target clink_mysql_tests clink_integration_tests \
                clink_node clink_submit_sql -j "$(( $(nproc) / 2 + 1 ))"
              ccache -s | tail -3'
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mysql-${{ github.run_id }}
      - name: Fetch the pinned Docker CLI
        # The toolchain image carries no Docker client; the recovery cells read
        # the table through the server container's mysql client with this one,
        # verified against its pin.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker.tgz" \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz"
          echo "${DOCKER_CLI_SHA256}  ${RUNNER_TEMP}/docker.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/docker.tgz" -C "${RUNNER_TEMP}" docker/docker
      - name: Run the gate
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/mysql-live-reports"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${RUNNER_TEMP}/docker/docker:/usr/local/bin/docker:ro \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_MYSQL_TEST_DSN -e CLINK_MYSQL_TEST_CONTAINER \
            -e CLINK_MYSQL_RECOVERY_LOG_DIR \
            ${TOOLCHAIN}"
          scripts/mysql-live.sh build 2>&1 | tee "${RUNNER_TEMP}/mysql-gate.log"
      - name: Keep the reports and the cells' evidence
        # The reports carry every case's result, per server and phase; each
        # run's log carries the recovery cells' "[mysql-cdc-recovery]" and
        # "[mysql-sink-recovery]" lines and the fault framework's witness lines;
        # each phase's recovery-logs/ holds every cell's coordinator and worker
        # logs; provenance.txt names the commit, the build's configuration, the
        # client library and each server's version, image and binlog settings,
        # and each phase's result. On failure a server's directory also holds
        # its own log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-gate
          path: |
            ${{ runner.temp }}/mysql-live-reports/**
            ${{ runner.temp }}/mysql-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Upload the harness logs on failure
        # The harness keeps its scratch tree, with every Coordinator and
        # Worker log, when a recovery cell fails.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-harness-logs
          path: /tmp/clink_it_*/logs/**
          if-no-files-found: ignore
          retention-days: 14
