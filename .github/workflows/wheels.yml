# Build self-contained pyclink wheels.
#
# pyclink is pure Python (ctypes) over libclink's C ABI, so a wheel ships ONE
# artifact: the platform libclink shared library placed next to the package. The
# wheel is tagged py3-none-<arch> (setup.py -> platform_wheel.get_tag): a native
# library but no CPython ABI, so a SINGLE wheel serves every Python 3 on a
# platform. There is therefore no per-Python axis to fan out over.
#
# Why a manual build+repair matrix and NOT cibuildwheel:
#   * cibuildwheel's whole value is the CPython ABI fan-out (cp39..cp313 x abi).
#     With one py3-none-<arch> wheel per platform that axis is empty - it would
#     rebuild the identical wheel N times and we would fight CIBW_BUILD/CIBW_SKIP
#     to stop it. No gain.
#   * The expensive, correctness-critical part is the pinned Arrow 24 + iceberg-cpp
#     toolchain (scripts/versions.env); CMakeLists.txt FATAL_ERRORs if the linked
#     Arrow is not that exact version. cibuildwheel owns its own manylinux image and
#     would need CIBW_BEFORE_ALL to rebuild that whole toolchain from source inside
#     its ephemeral container on every run (~40 min, torn down between arches). We
#     already have the toolchain: the GHCR clink-build image (baked at /usr/local,
#     layer-cached) for Linux and a cached ~/.clink-deps for macOS. A manual matrix
#     reuses them directly, exactly like ci.yml.
#   * Repair uses the very tools cibuildwheel would call - delocate on macOS,
#     auditwheel on Linux - so we lose nothing on the vendoring step.
#
# PLATFORM SCOPE (read before you rely on a Linux wheel):
#   macos-arm64  Shipped on every tag. Natively built + delocated + smoke-tested,
#                and self-contained to the point of vendoring NO dylibs at all
#                (static Arrow, system libs only). TWO CAPABILITY CAVEATS, both
#                deliberate and both required to keep the macOS floor below the
#                build host's: its Arrow has no object-store filesystems, so
#                s3:// / gs:// / abfs:// do not work; and its HTTP subsystem has
#                no TLS, so it serves and fetches plain HTTP only. Local files,
#                SQL and the embedded engine are unaffected. Build from source
#                for either capability. Reasons in the macos-wheel job env.
#   linux        Shipped on every tag, x86_64 and aarch64, WITH the Kafka
#                connector. Built inside quay.io/pypa/manylinux_2_28_<arch> on the
#                arch's native runner by scripts/build-manylinux-wheel.sh: the pinned
#                Arrow from source with the object stores off, a static librdkafka,
#                and libclink with Arrow linked statically (CLINK_STATIC_ARROW), so
#                it needs only glibc, libstdc++ and libgcc_s and auditwheel vendors
#                nothing. scripts/check-wheel-self-contained.py fails the job
#                otherwise (auditwheel alone once passed a wheel that loaded a
#                second, shared Arrow). Same capability caveats as macOS (no object
#                stores, no HTTPS), plus: Kafka TLS/SASL use the OpenSSL bundled in
#                librdkafka; GSSAPI and the Schema Registry formats are left out.
#                The Arrow + librdkafka prefix is cached on the pins.
#
# Shape ({macos-arm64, linux-x86_64, linux-aarch64}):
#   macos-wheel         native macos-26 (its SDK's libc++ defines std::jthread /
#                       std::stop_token, which older SDKs do not); cached
#                       ~/.clink-deps; delocate.
#   linux-wheels        matrix {x86_64, aarch64}; inside the manylinux_2_28 image on
#                       the native runner; cached /opt/clink-deps; auditwheel +
#                       the self-contained gate + a smoke test.
#   linux-wheels-verify install each Linux wheel on a stock Ubuntu 22.04 runner,
#                       outside the build image, and run the smoke test there.
#   publish             on a release tag only: upload all three wheels to PyPI
#                       through trusted publishing (the pypi environment).
#   collect             gather whatever wheels were built into one artifact.

name: wheels

on:
  # A release tag produces wheels again. This was manual-only from 2026-07-18 to
  # 2026-07-25 under a note blaming clink's std::jthread usage; that diagnosis was
  # wrong twice over. The C++20 sync library is gated to macOS 11.0, BELOW this
  # wheel's floor and equal to Apple silicon's own first release, so it never cost
  # anything. What actually blocked the build was the SDK (macos-15's libc++ does
  # not define jthread at all), and what then blocked the REPAIR was every
  # Homebrew bottle on the newer image carrying that image's minimum macOS
  # version. Fixed by building on macos-26 and taking Homebrew off the wheel's
  # link line entirely: no object stores, no HTTPS, Arrow's deps bundled at the
  # floor. Result: pyclink-0.1.0-py3-none-macosx_14_0_arm64.whl with ZERO
  # vendored dylibs.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # macOS floor. Drives BOTH the libclink minos (passed to cmake by
  # build-libclink-wheel.sh and build-arrow.sh) AND the wheel platform tag
  # (wheel's get_platform reads this env var), so binary and tag agree. Bumping
  # it busts the ~/.clink-deps cache so Arrow is rebuilt at the new floor.
  #
  # It is also the wheel's runtime floor. std::jthread and std::stop_token carry libc++'s
  # _LIBCPP_AVAILABILITY_SYNC, which resolves to macOS 11.0 (verified: at a
  # 10.15 target they are "unavailable: introduced in macOS 11.0", at 11.0 they
  # compile) - and 11.0 is also the first macOS on Apple silicon, so on an arm64
  # wheel the C++20 sync library costs nothing at all in reach.
  #
  # 14.0 is kept because the availability floor is not the binding constraint
  # here: whether the types EXIST is a property of the build SDK (see the
  # macos-wheel job), and Arrow is compiled against this same value. Lower it if
  # a macOS 11-13 user ever asks; nothing in clink's own source stands in the way.
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  # The manylinux policy the Linux wheels are built for and must carry
  # (scripts/build-manylinux-wheel.sh runs in quay.io/pypa/manylinux_2_28_<arch>).
  MANYLINUX_TARGET: "2.28"

jobs:
  macos-wheel:
    name: Wheel (macos-arm64)
    # The build host must be new enough that its SDK's libc++ DEFINES the C++20
    # sync library. clink uses std::jthread / std::stop_token throughout, and on
    # an older SDK they are simply absent from the headers ("no type named
    # 'jthread' in namespace 'std'"), so libclink cannot compile.
    #
    # This is the SDK, not the compiler and not the deployment target. Measured on
    # the 2026-07-25 runs: macos-15 gave AppleClang 17.0.0 - the same compiler
    # version that builds clink fine locally - but paired with Xcode 16.4's SDK,
    # and that SDK's libc++ has no jthread. The identical compiler against SDK 26
    # compiles it at a deployment target of 11.0. A deployment-target problem
    # would read "unavailable: introduced in macOS 11.0" instead, which is a
    # different failure entirely.
    #
    # Hence a newer image. The step below then selects the newest Xcode installed
    # on it, and the probe after that fails in two readable lines if the pairing
    # still lacks the sync library.
    runs-on: macos-26
    env:
      # The wheel's Arrow is built WITHOUT the object-store filesystems (S3, GCS,
      # Azure), in its own prefix.
      #
      # Why: those three drag in the bundled aws-sdk + aws-c-* chain and the OpenSSL
      # that google-cloud-cpp and the Azure SDK need. delocate vendors those dylibs
      # into the wheel, and each Homebrew-built one carries the BUILD HOST's minimum
      # macOS version - 26.0 on this image - so a wheel tagged macosx_14_0 cannot
      # honestly ship them and delocate refuses ("Library dependencies do not satisfy
      # target MacOS version 14.0"). Measured in two steps on 2026-07-25: dropping S3
      # alone removed the whole aws chain and left exactly libssl/libcrypto behind,
      # arriving via GCS and Azure; dropping all three removes those too.
      #
      # THE COST, stated plainly: s3://, gs:// and abfs:// paths do not work in the
      # wheel. pyclink reads and writes local files and runs SQL; a pipeline needing
      # an object store (or Iceberg on one) must build clink from source, where they
      # are on by default. All three are impls/ connectors the wheel does not build
      # anyway, and clink's S3 usage is guarded on Arrow's ARROW_S3 macro, so those
      # paths fail with that explanation rather than crashing.
      #
      # The separate prefix keeps this away from a normal ~/.clink-deps: nothing else
      # should silently inherit a stripped toolchain.
      CLINK_ARROW_OBJECT_STORES: "OFF"
      CLINK_DEPS_PREFIX: "/Users/runner/.clink-deps-wheel"
      # Do not let clink_core link Homebrew's zstd: on this image that bottle is
      # built for macOS 26 and would pin libclink above the wheel's floor. IGNORE
      # is CMake's not-found sentinel, so clink takes its Arrow-bundled zstd
      # fallback instead (build-scope only, which is all a wheel needs).
      CLINK_ZSTD_LIBRARY: "IGNORE"
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # The runner image's DEFAULT Xcode is not always its newest, and clink
        # needs a libc++ that ships std::jthread / std::stop_token as non
        # experimental. On an older one they are absent from the headers
        # entirely - the failure reads "no type named 'jthread' in namespace
        # 'std'", which is a toolchain-version problem and NOT the deployment
        # target (that failure would instead say "unavailable: introduced in
        # macOS 11.0"). Picking the highest-versioned Xcode present keeps this
        # working as images roll forward, without pinning a version that will
        # eventually be removed.
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "${newest}" ]; then
            echo "Selecting ${newest}"
            sudo xcode-select -s "${newest}"
          fi
          clang++ --version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Check the toolchain has the C++20 sync library
        # Fail here, in two lines of diagnostics, rather than 200 lines into
        # libclink's template errors. Both facts that matter are asserted: the
        # types exist, and they are available at the wheel's deployment target.
        run: |
          set -euo pipefail
          cat > /tmp/sync_probe.cpp <<'CPP'
          #include <thread>
          #include <stop_token>
          int main() { std::jthread t([](std::stop_token s) { (void)s; }); return 0; }
          CPP
          clang++ -std=c++20 -mmacosx-version-min="${MACOSX_DEPLOYMENT_TARGET}" \
            /tmp/sync_probe.cpp -o /tmp/sync_probe
          echo "std::jthread / std::stop_token available at macOS ${MACOSX_DEPLOYMENT_TARGET}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System build deps (Homebrew)
        # cmake only. aws-sdk-cpp is deliberately NOT installed: this wheel's Arrow
        # is built without the object stores, so nothing needs it, and every
        # Homebrew bottle on this image targets macOS 26 - keeping them off the
        # prefix path is what lets the wheel keep a lower floor.
        run: brew install cmake

      - name: Restore pinned toolchain (the wheel's stripped prefix)
        # Restore/save split rather than actions/cache: the Arrow source build is
        # ~25 min and a run that fails LATER (at wheel repair, say) would otherwise
        # discard it and pay again on the next attempt.
        #
        # Keyed on versions.env, the macOS floor AND the object-store setting, so
        # changing any busts it and Arrow is rebuilt with the right features at the
        # right minos. build-arrow.sh is idempotent and exits early on a hit (it
        # stamps the feature set beside the install, so a prefix built the other way
        # is not reused).
        #
        # This prefix is the wheel's own: it holds an Arrow without the object-store
        # filesystems, and a normal ~/.clink-deps must never be confused with it.
        uses: actions/cache/restore@v4
        with:
          path: ~/.clink-deps-wheel
          key: clink-deps-${{ runner.os }}-${{ runner.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-obj${{ env.CLINK_ARROW_OBJECT_STORES }}-hermetic-${{ hashFiles('scripts/versions.env', 'scripts/build-arrow.sh') }}

      - name: Bootstrap pinned Arrow (at the macOS floor)
        # MACOSX_DEPLOYMENT_TARGET is exported job-wide, so cmake inside this
        # script pins Arrow's objects to the same minos as libclink - no minos
        # skew between the vendored Arrow and the wheel tag.
        #
        # iceberg-cpp is deliberately NOT bootstrapped for the wheel: the wheel
        # builds libclink with CLINK_BUILD_IMPLS=OFF, which never configures or
        # links iceberg (find_package(iceberg) lives only under impls/iceberg,
        # gated by CLINK_BUILD_IMPLS; the state-export=iceberg CLI is gated on
        # TARGET clink::iceberg). Building it here is pure dead weight (~10 min)
        # for a lib the wheel never links - so skip it and build only Arrow.
        run: |
          set -euo pipefail
          scripts/build-arrow.sh

      - name: Save pinned toolchain
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.clink-deps-wheel
          key: clink-deps-${{ runner.os }}-${{ runner.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-obj${{ env.CLINK_ARROW_OBJECT_STORES }}-hermetic-${{ hashFiles('scripts/versions.env', 'scripts/build-arrow.sh') }}

      - name: Wheel build tooling
        run: python -m pip install --upgrade pip build delocate pytest

      - name: Build lean libclink and stage it
        # Build the heavy library once, OUTSIDE the wheel build (setup.py then
        # just copies CLINK_LIB rather than rebuilding clink_shared). The stage
        # path is passed as an argument so nothing lands in the source tree.
        # build-libclink-wheel.sh pins CMAKE_OSX_DEPLOYMENT_TARGET from the env,
        # so libclink's minos matches the wheel tag.
        run: bash scripts/build-libclink-wheel.sh "${RUNNER_TEMP}/libclink-staged"

      - name: Build wheel
        run: |
          set -euo pipefail
          export CLINK_LIB="${RUNNER_TEMP}/libclink-staged"
          python -m build --wheel \
            --outdir "${RUNNER_TEMP}/dist" \
            "${{ github.workspace }}/python"

      - name: Report the wheel's shared-library closure
        # Prints, for every external dylib the wheel needs, which library asks for
        # it. When the repair step below refuses a dependency for carrying too high
        # a macOS minimum, this is what identifies who dragged it in - otherwise the
        # error names the offender but not the cause.
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="${CLINK_DEPS_PREFIX}/lib:/opt/homebrew/lib:${DYLD_LIBRARY_PATH:-}"
          echo "--- delocate-listdeps --depending ---"
          delocate-listdeps --all --depending "${RUNNER_TEMP}"/dist/*.whl || true
          echo "--- otool -L on the staged libclink ---"
          otool -L "${RUNNER_TEMP}/libclink-staged" || true

      - name: Repair wheel (delocate)
        # Vendors the Arrow transitive dylibs (curl / xml2 / lz4 / zstd / ...)
        # into the wheel so it is self-contained. The aws-sdk / aws-c-* / OpenSSL
        # chain is absent by construction here: this Arrow is built without the
        # object-store filesystems (see the job env), which is what keeps the
        # vendored set inside the wheel's macOS floor.
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="${CLINK_DEPS_PREFIX}/lib:/opt/homebrew/lib:${DYLD_LIBRARY_PATH:-}"
          delocate-wheel --require-archs arm64 \
            -w "${RUNNER_TEMP}/wheelhouse" \
            "${RUNNER_TEMP}"/dist/*.whl
          ls -l "${RUNNER_TEMP}/wheelhouse"

      - name: Assert the object-store chain was not vendored
        # The stripped Arrow is the whole reason this wheel can carry a macOS floor
        # below the build host's. If an Arrow or CMake change ever drags those
        # libraries back in, delocate would vendor them and their 26.0 minimum
        # would either fail the repair or, worse, quietly raise what the wheel
        # actually requires. Fail here, naming the offender.
        run: |
          set -euo pipefail
          whl="$(ls "${RUNNER_TEMP}"/wheelhouse/*.whl)"
          vendored="$(unzip -Z1 "${whl}" | grep '\.dylibs/' || true)"
          echo "vendored dylibs:"; echo "${vendored}"
          if echo "${vendored}" | grep -Ei 'aws-|libssl|libcrypto|google_cloud|azure'; then
            echo "::error::an object-store dependency was vendored into the wheel - the wheel's Arrow should be built with CLINK_ARROW_OBJECT_STORES=OFF" >&2
            exit 1
          fi
          echo "no object-store dylibs vendored"

      - name: Install + test in a fresh venv (bundled lib)
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/testvenv"
          . "${RUNNER_TEMP}/testvenv/bin/activate"
          pip install --upgrade pip
          pip install "${RUNNER_TEMP}"/wheelhouse/*.whl pytest
          unset CLINK_LIB
          # Gate: with CLINK_LIB unset, Engine() must load the library bundled in the
          # wheel and run a real job end to end - the proof the wheel is self-contained.
          ( cd "${RUNNER_TEMP}" && python "${{ github.workspace }}/python/tests/wheel_smoke.py" )
          # Functional suite, driven against the wheel's own vendored library.
          export CLINK_LIB="$(python -c 'import os,pyclink;print(os.path.join(os.path.dirname(pyclink.__file__),"libclink.dylib"))')"
          pytest "${{ github.workspace }}/python/tests" -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: ${{ runner.temp }}/wheelhouse/*.whl
          if-no-files-found: error

  # Linux x86_64 + aarch64, each inside the manylinux_2_28 image on its native
  # runner. The whole build is scripts/build-manylinux-wheel.sh; this job only
  # restores and saves the Arrow + librdkafka prefix it builds.
  linux-wheels:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            plat_arch: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            plat_arch: aarch64
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.plat_arch }}
    env:
      CLINK_DEPS_PREFIX: /opt/clink-deps
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Arrow + librdkafka prefix
        uses: actions/cache@v4
        with:
          path: /opt/clink-deps
          key: manylinux-deps-${{ matrix.plat_arch }}-${{ hashFiles('scripts/versions.env', 'scripts/build-arrow.sh', 'scripts/build-librdkafka.sh') }}
      - name: Build, repair, gate and smoke-test the wheel
        run: |
          git config --global --add safe.directory "${{ github.workspace }}"
          scripts/build-manylinux-wheel.sh "${RUNNER_TEMP}/wheelhouse"
      - name: Gate the manylinux policy
        run: |
          set -euo pipefail
          tag="$(basename "$(ls "${RUNNER_TEMP}"/wheelhouse/*.whl | head -1)")"
          want="manylinux_${MANYLINUX_TARGET/./_}_${{ matrix.plat_arch }}"
          echo "wheel: ${tag}  (want ${want})"
          [[ "${tag}" == *"${want}"* ]] || { echo "::error::${tag} is not ${want}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: ${{ runner.temp }}/wheelhouse/*.whl
          if-no-files-found: error

  # The same wheels installed where users install them: a stock runner, outside the
  # build image, with pip and PyPI's pyarrow; then a live Kafka round trip against a
  # Redpanda broker on the runner, observed from outside by rpk.
  linux-wheels-verify:
    name: Verify (${{ matrix.name }} on Ubuntu 22.04)
    needs: linux-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse
      - name: Install in a fresh venv and smoke-test
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/v"
          "${RUNNER_TEMP}/v/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/v/bin/pip" install wheelhouse/*.whl pyarrow
          unset CLINK_LIB
          ( cd "${RUNNER_TEMP}" && "${RUNNER_TEMP}/v/bin/python" "${{ github.workspace }}/python/tests/wheel_smoke.py" )
      - name: Start a Redpanda broker
        # docker run rather than a services: entry, which cannot pass the broker the
        # arguments it needs to advertise an address the runner can reach. Same image
        # and flags as the integration tests (tests/integration/docker_kafka.hpp).
        run: |
          set -euo pipefail
          docker run -d --name rp -p 19092:19092 redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://127.0.0.1:9092,external://127.0.0.1:19092
          for _ in $(seq 60); do
            docker exec rp rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && break
            sleep 2
          done
          docker exec rp rpk cluster health
          # dev-container mode does not auto-create topics.
          docker exec rp rpk topic create wheel-in wheel-out
          for i in 1 2 3 4 5; do echo "{\"id\":$i,\"v\":\"r$i\"}"; done \
            | docker exec -i rp rpk topic produce wheel-in -f '%v\n'
      - name: Live Kafka round trip through the wheel
        run: |
          set -euo pipefail
          unset CLINK_LIB
          ( cd "${RUNNER_TEMP}" && BROKERS=127.0.0.1:19092 \
              "${RUNNER_TEMP}/v/bin/python" "${{ github.workspace }}/python/tests/wheel_kafka_live.py" )
          # The produce side, checked from outside pyclink.
          got="$(docker exec rp rpk topic consume wheel-out -n 5 -f '%v\n' | wc -l)"
          echo "rpk read ${got} records from wheel-out"
          [ "${got}" -eq 5 ]

  # Publish to PyPI on a release tag, through PyPI trusted publishing: the pypi
  # environment's OIDC identity is what PyPI trusts (pending publisher: project
  # pyclink, owner orhaugh, repo clink, workflow wheels.yml, environment pypi), so
  # no token is stored anywhere. Runs only after every wheel built and both Linux
  # wheels passed their stock-runner and live Kafka checks, and refuses unless all
  # three platform wheels are present and carry the tag's version.
  publish:
    name: Publish to PyPI
    needs: [macos-wheel, linux-wheels, linux-wheels-verify]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyclink
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Check the wheel set against the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ls -l dist
          for plat in macosx_14_0_arm64 manylinux_2_28_x86_64 manylinux_2_28_aarch64; do
            want="dist/pyclink-${version}-py3-none-${plat}.whl"
            [ -f "${want}" ] || { echo "::error::missing ${want}"; exit 1; }
          done
          extra="$(ls dist | grep -v "^pyclink-${version}-py3-none-" || true)"
          [ -z "${extra}" ] || { echo "::error::unexpected files in dist: ${extra}"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Gather every platform wheel that was built into one downloadable artifact.
  # Runs whenever the macOS wheel succeeded, so a failed Linux build does not
  # hold back the macOS wheel (its failure still fails the run).
  collect:
    name: Gather wheels
    needs: [macos-wheel, linux-wheels]
    if: ${{ always() && needs.macos-wheel.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: List
        run: ls -l dist
      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyclink-wheels
          path: dist/*.whl
          if-no-files-found: error
