name: neo4j

# The Neo4j connector's gate (scripts/neo4j-live.sh): every Neo4j sink and
# lookup test against a real server, Neo4j 2026.09.0 Community pinned by digest
# in docker/integration-services.yml, over HTTP and over HTTPS with a CA
# generated per run; the SQL-level cases, embedded SQL pipelines into and
# enriched from the server among them; and the recovery cells, a coordinator
# and two workers running SQL jobs from Kafka into the server (a worker killed
# before a request and after a commit, the server restarted under the running
# job) and enriched from it through a lookup join (a worker killed with a
# lookup in flight, outages inside and past the retry budget, a graph change
# before a replay, a failing lookup), each checked against what the events and
# the reference graph imply. A live test skips when its server or binary is
# missing and gtest counts that as a pass, so the gate fails on any skip and on
# any required suite that did not run.
#
# The script runs on the runner, where it brings the servers up and down with
# Docker Compose; the test binaries run inside the toolchain image through
# PIN_RUNNER, on the runner's network, with the runner's Docker daemon reachable
# through its socket and a pinned static CLI, which the outage cases and the
# Kafka broker of the recovery cells use.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: neo4j-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_CLI_VERSION: 29.8.2
  DOCKER_CLI_SHA256: 995d1ef289677f74fd58d8d2c35727b6a4ee389c69db8638a3e42d0487aa5b0f

jobs:
  live:
    name: The Neo4j sink and lookup hold their contracts against a real server
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build:main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what is under test
        run: |
          echo "commit under test: $(git rev-parse HEAD)"
          docker pull -q "${TOOLCHAIN}"
          df -h /
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-neo4j-${{ github.run_id }}
          restore-keys: ccache-neo4j-
      - name: Build the Neo4j tests, the recovery cells and the node binaries
        # Debug without DWARF and stripped, as the build job builds.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ccache"
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${RUNNER_TEMP}/ccache:/root/.ccache" \
            -e CLINK_DEPS_PREFIX=/usr/local -e CCACHE_DIR=/root/.ccache -e CCACHE_MAXSIZE=1500M \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${TOOLCHAIN}" bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends ccache >/dev/null
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCLINK_BUILD_TESTS=ON -DCLINK_BUILD_SQL=ON \
                -DCLINK_INTEGRATION_TESTS=ON -DCLINK_WITH_NEO4J=ON -DCMAKE_C_FLAGS_DEBUG=-g0 \
                -DCMAKE_CXX_FLAGS_DEBUG=-g0 -DCMAKE_EXE_LINKER_FLAGS=-s -DCMAKE_SHARED_LINKER_FLAGS=-s
              cmake --build build --target clink_neo4j_tests clink_neo4j_sql_tests \
                clink_integration_tests clink_node clink_submit_sql -j "$(( $(nproc) / 2 + 1 ))"
              ccache -s | tail -3'
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-neo4j-${{ github.run_id }}
      - name: Fetch the pinned Docker CLI
        # The toolchain image carries no Docker client; the outage cases and
        # the recovery cells drive the runner's daemon with this one, verified
        # against its pin.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker.tgz" \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz"
          echo "${DOCKER_CLI_SHA256}  ${RUNNER_TEMP}/docker.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/docker.tgz" -C "${RUNNER_TEMP}" docker/docker
      - name: Run the gate
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/neo4j-live-reports"
          export NEO4J_LIVE_TMPDIR="${RUNNER_TEMP}"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${RUNNER_TEMP}/docker/docker:/usr/local/bin/docker:ro \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_NEO4J_TEST_ENDPOINT -e CLINK_NEO4J_TEST_PASSWORD -e CLINK_NEO4J_TEST_CONTAINER \
            -e CLINK_NEO4J_TEST_TLS_ENDPOINT -e CLINK_NEO4J_TEST_TLS_CA -e CLINK_NEO4J_TEST_TLS_WRONG_CA \
            ${TOOLCHAIN}"
          scripts/neo4j-live.sh build 2>&1 | tee "${RUNNER_TEMP}/neo4j-gate.log"
      - name: Keep the reports and the cells' evidence
        # The reports carry every case's result; the gate log carries each
        # recovery cell's "[neo4j-recovery]" or "[neo4j-lookup-recovery]" line
        # and the fault framework's witness lines, and on failure the report
        # directory holds the servers' own logs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo4j-gate
          path: |
            ${{ runner.temp }}/neo4j-live-reports/**
            ${{ runner.temp }}/neo4j-gate.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the harness logs on failure
        # The harness keeps its scratch tree, with every Coordinator and
        # Worker log, when a recovery cell fails.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neo4j-harness-logs
          path: /tmp/clink_it_*/logs/**
          if-no-files-found: ignore
          retention-days: 14
