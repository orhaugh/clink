name: postgres-cdc

# The PostgreSQL CDC gate (scripts/postgres-cdc-live.sh): every PostgreSQL
# connector test against a real server, PostgreSQL 16.15 pinned by digest in
# docker/integration-services.yml; the SQL CDC round trip through the upsert
# sink; the CDC recovery cells, a coordinator and two workers capturing a
# table into ClickHouse with a worker killed at each phase boundary of the
# source and the server restarted, checked against the table and against
# every row version the workload committed; and a column added through
# `clink stop` and a restore, backfilled into the same ClickHouse tables with
# and without a worker killed during the backfill, with no key holding two
# different rows under one __version. A live test skips when its server or
# binary is missing and gtest counts that as a pass, so the gate fails on any
# skip and on any required suite that did not run.
#
# Plain runner steps that `docker run` the toolchain image, as the ClickHouse
# recovery workflow does: the tests reach the servers on the runner's
# loopback, and the recovery cells drive the runner's Docker daemon through
# its socket with a pinned static CLI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: postgres-cdc-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_CLI_VERSION: 29.8.2
  DOCKER_CLI_SHA256: 995d1ef289677f74fd58d8d2c35727b6a4ee389c69db8638a3e42d0487aa5b0f

jobs:
  live:
    name: PostgreSQL CDC holds its contract against real servers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build:main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what is under test
        run: |
          echo "commit under test: $(git rev-parse HEAD)"
          docker pull -q "${TOOLCHAIN}"
          df -h /
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-postgres-cdc-${{ github.run_id }}
          restore-keys: ccache-postgres-cdc-
      - name: Build the PostgreSQL tests, the recovery cells and the node binary
        # Debug without DWARF and stripped, as the build job builds.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ccache"
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${RUNNER_TEMP}/ccache:/root/.ccache" \
            -e CLINK_DEPS_PREFIX=/usr/local -e CCACHE_DIR=/root/.ccache -e CCACHE_MAXSIZE=1500M \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${TOOLCHAIN}" bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends ccache >/dev/null
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCLINK_BUILD_TESTS=ON -DCLINK_BUILD_SQL=ON \
                -DCLINK_INTEGRATION_TESTS=ON -DCMAKE_C_FLAGS_DEBUG=-g0 -DCMAKE_CXX_FLAGS_DEBUG=-g0 \
                -DCMAKE_EXE_LINKER_FLAGS=-s -DCMAKE_SHARED_LINKER_FLAGS=-s
              cmake --build build --target clink_postgres_tests clink_postgres_sql_tests \
                clink_integration_tests clink_node clink_submit_sql clink -j "$(( $(nproc) / 2 + 1 ))"
              ccache -s | tail -3'
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-postgres-cdc-${{ github.run_id }}
      - name: Fetch the pinned Docker CLI
        # The toolchain image carries no Docker client; the recovery cells
        # drive the runner's daemon with this one, verified against its pin.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker.tgz" \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz"
          echo "${DOCKER_CLI_SHA256}  ${RUNNER_TEMP}/docker.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/docker.tgz" -C "${RUNNER_TEMP}" docker/docker
      - name: Start the pinned PostgreSQL
        run: docker compose -f docker/integration-services.yml up -d --wait postgres-cdc
      - name: Run the gate
        run: |
          set -euo pipefail
          docker run --rm --user root --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/docker/docker:/usr/local/bin/docker:ro" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v /tmp:/tmp -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            -e REPORT_DIR="${RUNNER_TEMP}/postgres-cdc-reports" \
            -e CLINK_POSTGRES_CDC_TEST_DSN="host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres" \
            "${TOOLCHAIN}" scripts/postgres-cdc-live.sh build 2>&1 | tee "${RUNNER_TEMP}/postgres-cdc-gate.log"
      - name: Keep the reports and the recovery cells' evidence
        # The gate log carries each cell's "[pg-cdc]" line (rows, committed
        # versions, change-log rows, restarts) and the fault framework's
        # witness lines; the reports carry every case's result.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-cdc-gate
          path: |
            ${{ runner.temp }}/postgres-cdc-reports/**
            ${{ runner.temp }}/postgres-cdc-gate.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the harness logs on failure
        # The harness keeps its scratch tree, with every Coordinator and Worker
        # log, when a cell fails.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-cdc-harness-logs
          path: /tmp/clink_it_*/logs/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the server
        if: always()
        run: docker compose -f docker/integration-services.yml rm -sf postgres-cdc
