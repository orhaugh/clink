name: http

# The HTTP connectors' gates, from one build.
#
# The Elasticsearch and OpenSearch bulk sink's gate (scripts/search-live.sh), run
# once per product, one after the other, each against its pinned server from
# docker/integration-services.yml (elasticsearch 8.13.4, opensearch 2.17.1): the
# sink's offline suites against a model of the _bulk endpoint; the product's live
# suite, which reads back what the index holds (contents, ids repeated within
# and across batches, item failures, unconfirmed replies, a reply lost after the
# server applied the request, index-level refusals, throttling, cancellation);
# and the recovery cells, a coordinator and two workers polling a feed into the
# sink with a worker killed at the sink's fault points, replies that confirm
# nothing, and a reply lost after the server applied a flush, each verified by
# reading the index.
#
# The HTTP polling source's gate (scripts/http-poll-live.sh), against local
# servers the tests run themselves: the page reader, the options, the source
# against a scripted endpoint (paging, bounded completion, 204 and 304,
# conditional requests across cursor moves and restores, exact and encoded
# cursors, response bounds, retries, throttling, cancellation, errors that name
# no credential), the delivery analyser's verdicts, and the recovery cells, a
# worker killed with a page in flight at parallelism 1 and 2 and as a SQL job,
# each checked against the feed's dataset, with `clink run` reading the feed to
# its end. It runs whenever the build succeeded, whatever the search gates did.
#
# The InfluxDB sink's gate (scripts/influxdb-live.sh), against InfluxDB 2.7.12
# pinned by digest in the script: the renderer (point identity, escaping,
# refusals, timestamps, numbers), the reading of write responses, the sink
# against a stub server, the live suite, which reads back every point with Flux
# (exact timestamps, escapes, refused records beside good ones, a type
# conflict's partial write, merged identities, a reply lost after the server
# applied a batch, a refused token), and the recovery cells, a worker killed
# after writes the server applied, timestamped, in server-time mode and as a SQL
# job. It runs whenever the build succeeded, whatever the other gates did.
#
# The Prometheus Pushgateway sink's gate (scripts/prometheus-live.sh), against
# Pushgateway 1.10.0 pinned by digest in the script: the sample rules (series
# identity, names, label values, the value, grouping conflicts, bounds), the
# reading of push responses, the sink against a stub gateway in both
# push_series modes, the live suite, which reads every series back by scraping
# the gateway (labels and group values, values, refused records, each mode's
# replacement, a restored run, two writers, a type conflict, a reply lost after
# the gateway applied a push), and the recovery cells, a worker killed after a
# push the gateway applied and no checkpoint covered, in each mode and as a SQL
# job. It runs whenever the build succeeded, whatever the other gates did.
#
# A live test skips when its server or binary is missing and gtest counts that
# as a pass, so each gate fails on any skip and on any required suite that did
# not run in full. This workflow was named search until the polling source's
# gate joined it.
#
# The scripts run on the runner, where the search gate starts and removes the
# server with Docker; the test binaries run inside the toolchain image through
# PIN_RUNNER, on the runner's network.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOCKER_CLI_VERSION: 29.8.2
  DOCKER_CLI_SHA256: 995d1ef289677f74fd58d8d2c35727b6a4ee389c69db8638a3e42d0487aa5b0f

concurrency:
  group: http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: The search, InfluxDB and Pushgateway sinks and the polling source hold their contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build:main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what is under test
        run: |
          echo "commit under test: $(git rev-parse HEAD)"
          docker pull -q "${TOOLCHAIN}"
          df -h /
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-search-${{ github.run_id }}
          restore-keys: ccache-search-
      # ON, not AUTO: a missing HTTP module fails the configure rather than
      # leaving the gate without its binary. Debug without DWARF and stripped,
      # as the build job builds.
      - name: Build the HTTP connector tests, the recovery cells and the node and SQL binaries
        id: build
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ccache"
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${RUNNER_TEMP}/ccache:/root/.ccache" \
            -e CLINK_DEPS_PREFIX=/usr/local -e CCACHE_DIR=/root/.ccache -e CCACHE_MAXSIZE=1500M \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${TOOLCHAIN}" bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends ccache >/dev/null
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCLINK_BUILD_TESTS=ON -DCLINK_BUILD_SQL=ON \
                -DCLINK_INTEGRATION_TESTS=ON -DCLINK_WITH_HTTP=ON -DCMAKE_C_FLAGS_DEBUG=-g0 \
                -DCMAKE_CXX_FLAGS_DEBUG=-g0 -DCMAKE_EXE_LINKER_FLAGS=-s -DCMAKE_SHARED_LINKER_FLAGS=-s
              cmake --build build --target clink_http_connector_tests clink_integration_tests \
                clink_node clink_submit_sql -j "$(( $(nproc) / 2 + 1 ))"
              ccache -s | tail -3'
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-search-${{ github.run_id }}
      - name: Fetch the pinned Docker CLI
        # The toolchain image carries no Docker client; the cluster cases kill
        # and start nodes through the runner's daemon with this one.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/docker.tgz" \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz"
          echo "${DOCKER_CLI_SHA256}  ${RUNNER_TEMP}/docker.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/docker.tgz" -C "${RUNNER_TEMP}" docker/docker
      - name: Let multi-node servers pass their bootstrap checks
        run: |
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
      - name: Run the gates, Elasticsearch 8 and 9, then OpenSearch 2 and 3
        run: |
          set -euo pipefail
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${RUNNER_TEMP}/docker/docker:/usr/local/bin/docker:ro \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_ELASTICSEARCH_TEST_ENDPOINT -e CLINK_OPENSEARCH_TEST_ENDPOINT \
            -e CLINK_ELASTICSEARCH_THROTTLED_ENDPOINT -e CLINK_OPENSEARCH_THROTTLED_ENDPOINT \
            -e CLINK_ELASTICSEARCH_SECURED_ENDPOINT -e CLINK_ELASTICSEARCH_SECURED_CA \
            -e CLINK_ELASTICSEARCH_SECURED_USER -e CLINK_ELASTICSEARCH_SECURED_PASSWORD \
            -e CLINK_OPENSEARCH_SECURED_ENDPOINT -e CLINK_OPENSEARCH_SECURED_CA \
            -e CLINK_OPENSEARCH_SECURED_USER -e CLINK_OPENSEARCH_SECURED_PASSWORD \
            -e CLINK_ELASTICSEARCH_CLUSTER_ENDPOINT -e CLINK_ELASTICSEARCH_CLUSTER_NODES \
            -e CLINK_OPENSEARCH_CLUSTER_ENDPOINT -e CLINK_OPENSEARCH_CLUSTER_NODES \
            -e CLINK_SEARCH_RECOVERY_LOG_DIR \
            ${TOOLCHAIN}"
          status=0
          for product in elasticsearch elasticsearch9 opensearch opensearch3; do
            REPORT_DIR="${RUNNER_TEMP}/search-live-reports/${product}" \
              scripts/search-live.sh "${product}" build 2>&1 \
              | tee "${RUNNER_TEMP}/search-gate-${product}.log" || status=1
          done
          exit "${status}"
      - name: Run the polling source's gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_HTTP_POLL_RECOVERY_LOG_DIR \
            ${TOOLCHAIN}"
          REPORT_DIR="${RUNNER_TEMP}/http-poll-live-reports" \
            scripts/http-poll-live.sh build 2>&1 | tee "${RUNNER_TEMP}/http-poll-gate.log"
      - name: Run the InfluxDB sink's gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_INFLUXDB_TEST_ENDPOINT -e CLINK_INFLUXDB_TEST_ORG \
            -e CLINK_INFLUXDB_TEST_BUCKET -e CLINK_INFLUXDB_TEST_TOKEN \
            -e CLINK_INFLUXDB_TEST_VERSION -e CLINK_INFLUXDB_RECOVERY_LOG_DIR \
            ${TOOLCHAIN}"
          REPORT_DIR="${RUNNER_TEMP}/influxdb-live-reports" \
            scripts/influxdb-live.sh build 2>&1 | tee "${RUNNER_TEMP}/influxdb-gate.log"
      - name: Keep the InfluxDB sink's reports and the cells' evidence
        # The reports carry every case's result; the gate log and each run's log
        # carry the "[influxdb-live]" and "[influxdb-recovery]" lines and the
        # fault framework's witness lines; recovery-logs/ holds every cell's
        # coordinator and worker logs; provenance.txt names the commit, the
        # build's configuration and the server. On failure the report directory
        # also holds the server's own log. The gate's token is written nowhere.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: influxdb-gate
          path: |
            ${{ runner.temp }}/influxdb-live-reports/**
            ${{ runner.temp }}/influxdb-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Run the Pushgateway sink's gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_PUSHGATEWAY_TEST_ENDPOINT -e CLINK_PUSHGATEWAY_TEST_VERSION \
            -e CLINK_PUSHGATEWAY_RECOVERY_LOG_DIR \
            ${TOOLCHAIN}"
          REPORT_DIR="${RUNNER_TEMP}/prometheus-live-reports" \
            scripts/prometheus-live.sh build 2>&1 | tee "${RUNNER_TEMP}/prometheus-gate.log"
      - name: Keep the Pushgateway sink's reports and the cells' evidence
        # The reports carry every case's result; the gate log and each run's log
        # carry the "[prometheus-live]" and "[prometheus-recovery]" lines and the
        # fault framework's witness lines; recovery-logs/ holds every cell's
        # coordinator and worker logs and the final scrape its verdict rests on;
        # provenance.txt names the commit, the build's configuration and the
        # gateway. On failure the report directory also holds the gateway's log.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-gate
          path: |
            ${{ runner.temp }}/prometheus-live-reports/**
            ${{ runner.temp }}/prometheus-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Keep the polling source's reports and the cells' evidence
        # The reports carry every case's result; the gate log and each run's log
        # carry the "[http-poll-recovery]" and "[http-poll-sql]" verdict lines and
        # the fault framework's witness lines; recovery-logs/ holds every cell's
        # coordinator and worker logs; provenance.txt names the commit, the
        # build's configuration and the feed the cells served.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: http-poll-gate
          path: |
            ${{ runner.temp }}/http-poll-live-reports/**
            ${{ runner.temp }}/http-poll-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Keep the reports and the cells' evidence
        # The reports carry every case's result; each gate log and each run's
        # log carry the "[search-live]" and "[search-recovery]" verdict lines
        # and the fault framework's witness lines; recovery-logs/ holds every
        # cell's coordinator and worker logs; provenance.txt names the commit,
        # the build's configuration and the server. On failure a product's
        # report directory also holds the server's own log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-gate
          path: |
            ${{ runner.temp }}/search-live-reports/**
            ${{ runner.temp }}/search-gate-*.log
          if-no-files-found: warn
          retention-days: 90
      - name: Upload the harness logs on failure
        # The harness keeps its scratch tree, with every Coordinator and Worker
        # log, when a recovery cell fails.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: search-harness-logs
          path: /tmp/clink_it_*/logs/**
          if-no-files-found: ignore
          retention-days: 14
