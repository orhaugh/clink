name: cassandra

# The Cassandra connector's gate (scripts/cassandra-live.sh), run against both
# products it supports, one after the other: Apache Cassandra 4.1.12 and
# ScyllaDB 6.2.3, each pinned by digest in the script. Each run covers the
# offline suites (the record and key rules, the options, the table check, the
# bounds, write order and every failure class against a model of the server);
# the live suites (a long input through a small window, repeated writes to one
# row, deletes across early write-outs, composite keys with Unicode and wide
# integers, the key check, a refused write, Unavailable, a write the server
# applied whose reply a proxy withheld, a lost connection, cancel and close);
# embedded SQL pipelines into connector='cassandra'; and the recovery cells, a
# coordinator and two workers polling a feed into the sinks with a worker killed
# at the sinks' fault points, one of them a SQL job, each verified by reading the
# table directly. A live test skips when its server or binary is missing and
# gtest counts that as a pass, so the gate fails on any skip and on any required
# suite that did not run.
#
# The script runs on the runner, where it starts and removes the server with
# Docker; the test binaries run inside the toolchain image through PIN_RUNNER,
# on the runner's network.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cassandra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: The Cassandra and ScyllaDB sinks hold their contracts against both servers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build:main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Report what is under test
        run: |
          echo "commit under test: $(git rev-parse HEAD)"
          docker pull -q "${TOOLCHAIN}"
          df -h /
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-cassandra-${{ github.run_id }}
          restore-keys: ccache-cassandra-
      # ON, not AUTO: a driver missing from the image fails the configure rather
      # than leaving the gate without its binary. Debug without DWARF and
      # stripped, as the build job builds.
      - name: Build the Cassandra tests, the recovery cells and the node binaries
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ccache"
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${RUNNER_TEMP}/ccache:/root/.ccache" \
            -e CLINK_DEPS_PREFIX=/usr/local -e CCACHE_DIR=/root/.ccache -e CCACHE_MAXSIZE=1500M \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${TOOLCHAIN}" bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              apt-get update -q >/dev/null && apt-get install -y -q --no-install-recommends ccache >/dev/null
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCLINK_BUILD_TESTS=ON -DCLINK_BUILD_SQL=ON \
                -DCLINK_INTEGRATION_TESTS=ON -DCLINK_WITH_CASSANDRA=ON -DCMAKE_C_FLAGS_DEBUG=-g0 \
                -DCMAKE_CXX_FLAGS_DEBUG=-g0 -DCMAKE_EXE_LINKER_FLAGS=-s -DCMAKE_SHARED_LINKER_FLAGS=-s
              cmake --build build --target clink_cassandra_tests clink_cassandra_sql_tests \
                clink_integration_tests clink_node clink_submit_sql -j "$(( $(nproc) / 2 + 1 ))"
              ccache -s | tail -3'
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-cassandra-${{ github.run_id }}
      - name: Raise the asynchronous I/O limit ScyllaDB needs
        run: sudo sysctl -w fs.aio-max-nr=1048576
      - name: Run the gate against Apache Cassandra
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/cassandra-live-reports/cassandra"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_CASSANDRA_TEST_CONTACT_POINTS -e CLINK_CASSANDRA_TEST_PORT \
            -e CLINK_CASSANDRA_TEST_PRODUCT -e CLINK_CASSANDRA_TEST_VERSION \
            -e CLINK_CASSANDRA_RECOVERY_LOG_DIR \
            ${TOOLCHAIN}"
          scripts/cassandra-live.sh cassandra build 2>&1 | tee "${RUNNER_TEMP}/cassandra-gate.log"
      - name: Run the gate against ScyllaDB
        if: success() || failure()
        run: |
          set -euo pipefail
          export REPORT_DIR="${RUNNER_TEMP}/cassandra-live-reports/scylladb"
          export PIN_RUNNER="docker run --rm --user root --network host \
            -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} -w ${GITHUB_WORKSPACE} \
            -v /tmp:/tmp -v ${RUNNER_TEMP}:${RUNNER_TEMP} \
            -e CLINK_CASSANDRA_TEST_CONTACT_POINTS -e CLINK_CASSANDRA_TEST_PORT \
            -e CLINK_CASSANDRA_TEST_PRODUCT -e CLINK_CASSANDRA_TEST_VERSION \
            -e CLINK_CASSANDRA_RECOVERY_LOG_DIR \
            ${TOOLCHAIN}"
          scripts/cassandra-live.sh scylladb build 2>&1 | tee "${RUNNER_TEMP}/scylladb-gate.log"
      - name: Keep the reports and the cells' evidence
        # The reports carry every case's result; the gate logs and each run's
        # log carry the "[cassandra-live]" and "[cassandra-recovery]" lines and
        # the fault framework's witness lines; recovery-logs/ holds every cell's
        # coordinator and worker logs; provenance.txt names the commit, the
        # build's configuration and the server. On failure each product's report
        # directory also holds the server's own log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassandra-gate
          path: |
            ${{ runner.temp }}/cassandra-live-reports/**
            ${{ runner.temp }}/cassandra-gate.log
            ${{ runner.temp }}/scylladb-gate.log
          if-no-files-found: warn
          retention-days: 90
      - name: Upload the harness logs on failure
        # The harness keeps its scratch tree, with every Coordinator and
        # Worker log, when a recovery cell fails.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cassandra-harness-logs
          path: /tmp/clink_it_*/logs/**
          if-no-files-found: ignore
          retention-days: 14
