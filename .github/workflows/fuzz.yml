# Scheduled fuzz DISCOVERY. The corpus replay that gates every PR lives in the
# core test suite (tests/test_fuzz_corpus.cpp) and needs none of this; this
# workflow's job is to go LOOKING, on a cadence, with the sanitizers on.
#
# Determinism posture, stated because the hardening brief demands it: discovery
# is stochastic by nature. What is deterministic is everything around it - the
# seed corpus is generated from the real encoders, any crash artefact is
# uploaded and, once committed under fuzz/corpus/<target>/, is replayed by
# plain gtest on every build forever. A red here is a lead, not a gate: the
# gate is the reproducer it leaves behind.
#
# Runs weekly and on demand. NOT on pull requests - 5 x 300s of fuzzing per PR
# would buy little and cost every contributor ten minutes.
name: fuzz

on:
  schedule:
    - cron: "45 3 * * 1"  # Mondays 03:45 UTC, clear of the 02:30 sanitizer run
  workflow_dispatch:

permissions:
  contents: read
  # The toolchain container is pulled from ghcr with GITHUB_TOKEN, which
  # needs the packages scope - same as the sanitizers workflow. Without it
  # the pull is 'denied' and every matrix job dies at container init.
  packages: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The toolchain container, same as ci.yml's build jobs: the pinned Arrow
    # prefix is baked at /usr/local, without which the project does not even
    # configure (find_package(Arrow) is unconditional) - the first scheduled
    # run failed exactly there on the bare runner. A bare runner also cannot
    # LINK what it configures: the prebuilt Linux deps archive resolves
    # against the image's system libraries (aws-sdk above all), not the
    # runner's. libclang-rt for the fuzzer is NOT in the image (F80); it is
    # installed per-run below.
    container:
      image: ghcr.io/${{ github.repository_owner }}/clink-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # root: the runner mounts its file-command dirs root-owned; checkout
      # dies with EACCES under the image's non-root default user.
      options: --user root
    env:
      CLINK_DEPS_PREFIX: /usr/local
    strategy:
      fail-fast: false
      matrix:
        target: [cluster_frame, data_frame, checkpoint_meta, state_version_map, fault_spec]
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        # The checkout's safe.directory entry lands in the action user's
        # HOME, which differs from the run-step HOME in a container job;
        # without this the rev-parse below (and the plugin ABI hash inside
        # the build) fails with 'dubious ownership'.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Report the revision under test
        # Same rationale as the sanitizers workflow: a scheduled run tests
        # main's HEAD at the moment it fires, and a finding means nothing until
        # it is checked against that sha.
        run: |
          echo "fuzz(${{ matrix.target }}): testing $(git rev-parse HEAD)"
          echo "### Revision under test: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the fuzz runtime
        # Running as root inside the Debian container - no sudo. clang and
        # cmake are baked into the image; ninja and libclang-rt (the
        # libFuzzer runtime, F80) are not.
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends libclang-rt-dev ninja-build

      - name: Configure and build the target
        # SQL off: the fuzz targets do not touch it and the build is the slow
        # part of this job. The probe in fuzz/CMakeLists.txt compiles a
        # TestOneInput-only source - see the comment there for why a main()
        # in the probe reports a working toolchain as broken.
        run: |
          # CLINK_ENABLE_FAULT_INJECTION=ON explicitly: it defaults to AUTO,
          # which follows CLINK_BUILD_TESTS - and with tests off the fault_spec
          # target simply does not exist and this matrix job fails at build.
          cmake -S . -B build-fuzz -G Ninja \
            -DCLINK_BUILD_FUZZERS=ON -DCLINK_BUILD_SQL=OFF \
            -DCLINK_ENABLE_FAULT_INJECTION=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz --target clink_fuzz_${{ matrix.target }} clink_fuzz_seeds

      - name: Restore discovery corpus
        # The discovery corpus grows across runs; the committed seeds under
        # fuzz/corpus/ are the floor, not the ceiling.
        uses: actions/cache@v4
        with:
          path: corpus-work
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        run: |
          mkdir -p corpus-work artifacts
          ./build-fuzz/fuzz/clink_fuzz_seeds seeds
          cp seeds/${{ matrix.target }}/* corpus-work/ 2>/dev/null || true
          cp fuzz/corpus/${{ matrix.target }}/* corpus-work/ 2>/dev/null || true
          ./build-fuzz/fuzz/clink_fuzz_${{ matrix.target }} corpus-work \
            -max_total_time=300 -timeout=5 -artifact_prefix=artifacts/ \
            -print_final_stats=1 2>&1 | tail -20

      - name: Upload crash artefacts
        # The whole point of the run. A finding lands here; the fix is to
        # minimise it and commit it under fuzz/corpus/<target>/ so the gtest
        # replay owns it forever.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
