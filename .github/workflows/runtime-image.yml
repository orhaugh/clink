# Publish the clink runtime image (docker/Dockerfile.runtime) to GHCR.
#
# Why this workflow exists: the Helm chart, the k8s operator and the compose
# topologies all reference a `clink-runtime` image. Until this existed, that
# image only ever lived as a local tag on the author's machine, so the entire
# Kubernetes path was unreachable for anyone else - `helm install` pulled an
# image that does not exist on any registry. This publishes it.
#
# NOT on every push to main, deliberately. The image compiles clink_node in
# Release with LTO and fetches + builds RocksDB, so `COPY . /src` invalidates
# the expensive layer on every commit: roughly an hour of runner time per push
# for an artifact nobody consumes between releases. Releases get an image
# automatically; refresh the rolling `:main` tag by hand when you want one.
#
# Tags published (amd64 only - the toolchain image ci.yml publishes is amd64):
#   push v*            :<version> and :latest   (e.g. v0.1.1 -> :0.1.1, :latest)
#   workflow_dispatch  :main
#   both               :sha-<short sha>, so any deployment can be traced back
#                      to the commit that produced it
# With the ForSt engine opted in, every tag above gains a `-forst` suffix so an
# opt-in build can never silently overwrite the canonical image. The same
# applies to a fault-injection build (`-faultinj`), which exists so a
# qualification campaign can pull a ready-made image instead of compiling one
# on paid rig hardware - the rig then only has to exist for the campaign
# itself, and every host pulls the same digest rather than being fed a tarball
# over ssh.
#
# Visibility: the first run's package came out publicly pullable (verified by
# fetching the manifest with an anonymous ghcr token: HTTP 200), so no manual
# settings step was needed. If a future run or a fork produces a package that
# needs credentials, that is where to look - GHCR does not always inherit the
# repository's visibility, and a private runtime image leaves the chart no better
# off than the local tag it replaced.

name: runtime-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      toolchain_tag:
        description: "Tag of the ghcr clink-build toolchain image to build against."
        type: string
        default: "main"
      isa_baseline:
        description: "Raise the ISA baseline for compiled code (e.g. x86-64-v3 for AVX2). Empty = toolchain default. Publishes an -isa<level> suffixed tag so it never overwrites the portable image."
        type: string
        default: ""
      with_forst:
        description: "Bake in the ForSt state backend (forst:// and the forst_s3 schemes). Adds ~5-8 min and publishes -forst suffixed tags."
        type: boolean
        default: false
      qual11_jobs:
        description: "Bake in QUAL-11's schema-evolution job plugins (campaign fixtures). Publishes -qual11 suffixed tags: a shipped image must never carry campaign fixtures silently."
        type: boolean
        default: false
      fault_injection:
        description: "Compile in the named fault points (2PC crash windows) for a qualification campaign. Publishes -faultinj suffixed tags: a shipped image must never gain a fault surface silently."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# One image build at a time: they are long, and two concurrent runs would race
# on the shared registry build cache.
concurrency:
  group: runtime-image
  cancel-in-progress: false

env:
  # Owner-scoped so a fork publishes under its own namespace (mirrors ci.yml).
  IMAGE: ghcr.io/${{ github.repository_owner }}/clink-runtime
  TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build

jobs:
  publish:
    name: Build + push clink-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The toolchain image is large (Arrow, the AWS SDK and iceberg-cpp all
        # built from source), and on top of it this build compiles the engine in
        # Release plus RocksDB. The hosted runner's default free space is not
        # enough; these four directories are the standard reclaim and none of
        # them is used by a C++/CMake build.
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        # A tag push publishes the released version plus :latest; a manual run
        # refreshes :main. Both carry :sha-<short> so a running pod can always
        # be traced to a commit.
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ inputs.with_forst }}" = "true" ]; then suffix="-forst"; fi
          # An ISA-raised image is NOT portable (it faults on CPUs below the level),
          # so it must never take the :main or :latest tag a deployment pulls blindly.
          # The suffix keeps it addressable for an A/B while leaving those alone.
          isa="${{ inputs.isa_baseline }}"
          if [ -n "$isa" ]; then suffix="${suffix}-isa$(echo "$isa" | tr -cd 'a-zA-Z0-9')"; fi
          # A fault-injection build is for campaigns only. Arming
          # CLINK_FAULT_INJECT against an image that lacks the points is a
          # SILENT no-op, so the surface has to be visible in the tag - and
          # the tag must never be one a deployment pulls blindly.
          if [ "${{ inputs.fault_injection }}" = "true" ]; then suffix="${suffix}-faultinj"; fi
          # Same rule as the fault surface: campaign fixtures are visible
          # in the tag, never silently present in an image a deployment
          # might pull.
          if [ "${{ inputs.qual11_jobs }}" = "true" ]; then suffix="${suffix}-qual11"; fi
          short="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          tags="${IMAGE}:sha-${short}${suffix}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${tags},${IMAGE}:${version}${suffix},${IMAGE}:latest${suffix}"
          else
            tags="${tags},${IMAGE}:main${suffix}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.TOOLCHAIN }}:${{ inputs.toolchain_tag || 'main' }}
            CLINK_WITH_FORST=${{ inputs.with_forst == true && 'ON' || 'OFF' }}
            CLINK_ISA_BASELINE=${{ inputs.isa_baseline }}
            CLINK_ENABLE_FAULT_INJECTION=${{ inputs.fault_injection == true && 'ON' || 'OFF' }}
            CLINK_BUILD_QUAL11_JOBS=${{ inputs.qual11_jobs == true && 'ON' || 'OFF' }}
            CLINK_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=clink streaming runtime (clink_node + the clink client CLI)
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Smoke the published image
        # Cheap proof that what was pushed actually runs, rather than merely
        # having compiled: both binaries must respond on their own.
        run: |
          set -euo pipefail
          ref="$(echo '${{ steps.tags.outputs.tags }}' | cut -d, -f1)"
          echo "Smoking ${ref}"
          docker run --rm --entrypoint clink_node "${ref}" --help
          docker run --rm --entrypoint clink "${ref}" --help
