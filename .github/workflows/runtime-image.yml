# Publish the clink runtime image (docker/Dockerfile.runtime) to GHCR.
#
# Why this workflow exists: the Helm chart, the k8s operator and the compose
# topologies all reference a `clink-runtime` image. Until this existed, that
# image only ever lived as a local tag on the author's machine, so the entire
# Kubernetes path was unreachable for anyone else - `helm install` pulled an
# image that does not exist on any registry. This publishes it.
#
# NOT on every push to main, deliberately. The image compiles clink_node in
# Release with LTO and fetches + builds RocksDB, so `COPY . /src` invalidates
# the expensive layer on every commit: roughly an hour of runner time per push
# for an artifact nobody consumes between releases. Releases get an image
# automatically; refresh the rolling `:main` tag by hand when you want one.
#
# Tags published (amd64 only - the toolchain image ci.yml publishes is amd64):
#   push v*            :<version> and :latest   (e.g. v0.1.1 -> :0.1.1, :latest)
#   workflow_dispatch  :main
#   both               :sha-<short sha>, so any deployment can be traced back
#                      to the commit that produced it
# With the ForSt engine opted in, every tag above gains a `-forst` suffix so an
# opt-in build can never silently overwrite the canonical image. The same
# applies to a fault-injection build (`-faultinj`), which exists so a
# qualification campaign can pull a ready-made image instead of compiling one
# on paid rig hardware - the rig then only has to exist for the campaign
# itself, and every host pulls the same digest rather than being fed a tarball
# over ssh.
#
# Visibility: the first run's package came out publicly pullable (verified by
# fetching the manifest with an anonymous ghcr token: HTTP 200), so no manual
# settings step was needed. If a future run or a fork produces a package that
# needs credentials, that is where to look - GHCR does not always inherit the
# repository's visibility, and a private runtime image leaves the chart no better
# off than the local tag it replaced.

name: runtime-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      toolchain_tag:
        description: "Tag of the ghcr clink-build toolchain image to build against."
        type: string
        default: "main"
      isa_baseline:
        description: "Raise the ISA baseline for compiled code (e.g. x86-64-v3 for AVX2). Empty = toolchain default. Publishes an -isa<level> suffixed tag so it never overwrites the portable image."
        type: string
        default: ""
      with_forst:
        description: "Bake in the ForSt state backend (forst:// and the forst_s3 schemes). Adds ~5-8 min and publishes -forst suffixed tags."
        type: boolean
        default: false
      qual11_jobs:
        description: "Bake in QUAL-11's schema-evolution job plugins (campaign fixtures). Publishes -qual11 suffixed tags: a shipped image must never carry campaign fixtures silently."
        type: boolean
        default: false
      fault_injection:
        description: "Compile in the named fault points (2PC crash windows) for a qualification campaign. Publishes -faultinj suffixed tags: a shipped image must never gain a fault surface silently."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# One image build at a time: they are long, and two concurrent runs would race
# on the shared registry build cache.
concurrency:
  group: runtime-image
  cancel-in-progress: false

env:
  # Owner-scoped so a fork publishes under its own namespace (mirrors ci.yml).
  IMAGE: ghcr.io/${{ github.repository_owner }}/clink-runtime
  TOOLCHAIN: ghcr.io/${{ github.repository_owner }}/clink-build

jobs:
  publish:
    name: Build + push clink-runtime (${{ matrix.arch }})
    # One NATIVE runner per architecture. Emulating arm64 here is not an
    # option worth costing: this job compiles the whole engine in Release
    # plus RocksDB, and QEMU turns that from a long build into an unusable
    # one. The arm64 half exists so `docker run` on an Apple Silicon laptop
    # runs the real thing rather than an emulated x86 image - which is the
    # difference between trying clink and watching it crawl.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The toolchain image is large (Arrow, the AWS SDK and iceberg-cpp all
        # built from source), and on top of it this build compiles the engine in
        # Release plus RocksDB. The hosted runner's default free space is not
        # enough; these four directories are the standard reclaim and none of
        # them is used by a C++/CMake build.
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          platforms: ${{ matrix.platform }}
          # Untagged per-arch pushes; the merge job below applies the tags to
          # a manifest list covering both. Tagging here would leave whichever
          # arch finished last owning ":latest", which is how a multi-arch
          # image quietly becomes single-arch.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ env.TOOLCHAIN }}:${{ inputs.toolchain_tag || 'main' }}
            CLINK_WITH_FORST=${{ inputs.with_forst == true && 'ON' || 'OFF' }}
            CLINK_ISA_BASELINE=${{ inputs.isa_baseline }}
            CLINK_ENABLE_FAULT_INJECTION=${{ inputs.fault_injection == true && 'ON' || 'OFF' }}
            CLINK_BUILD_QUAL11_JOBS=${{ inputs.qual11_jobs == true && 'ON' || 'OFF' }}
            CLINK_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=clink streaming runtime (clink_node + the clink client CLI)
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Tag the multi-arch manifest
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # This runner is amd64, and the checks below RUN the arm64 image to
      # prove the example works there too. Emulation is fine for that: the
      # assertion is that rows come out, not how fast.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ inputs.with_forst }}" = "true" ]; then suffix="-forst"; fi
          isa="${{ inputs.isa_baseline }}"
          if [ -n "$isa" ]; then suffix="${suffix}-isa$(echo "$isa" | tr -cd 'a-zA-Z0-9')"; fi
          if [ "${{ inputs.fault_injection }}" = "true" ]; then suffix="${suffix}-faultinj"; fi
          if [ "${{ inputs.qual11_jobs }}" = "true" ]; then suffix="${suffix}-qual11"; fi
          short="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          tags="${IMAGE}:sha-${short}${suffix}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${tags},${IMAGE}:${version}${suffix},${IMAGE}:latest${suffix}"
          else
            tags="${tags},${IMAGE}:main${suffix}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Create the manifest
        run: |
          set -euo pipefail
          cd /tmp/digests
          # Refuse BEFORE tagging, not after. fail-fast is off so a broken
          # arm64 build still lets amd64 finish, and merging whatever showed
          # up would publish a single-arch image under ":latest" - working,
          # pullable, and wrong for half the people who pull it. The tags are
          # the thing that must never lie; failing here leaves the previous
          # ones in place.
          n="$(ls -1 | wc -l | tr -d ' ')"
          if [ "$n" -ne 2 ]; then
            echo "::error::expected 2 per-arch digests, found ${n} - refusing to tag a partial manifest"
            ls -la
            exit 1
          fi
          refs=""
          for d in *; do refs="${refs} ${IMAGE}@sha256:${d}"; done
          targs=""
          IFS=','
          for t in ${{ steps.tags.outputs.tags }}; do targs="${targs} -t ${t}"; done
          unset IFS
          echo "Merging${refs} into${targs}"
          docker buildx imagetools create ${targs} ${refs}
          first="$(echo '${{ steps.tags.outputs.tags }}' | cut -d, -f1)"
          docker buildx imagetools inspect "$first"

      - name: Smoke the published image
        # Cheap proof that what was pushed actually runs, rather than merely
        # having compiled: both binaries must respond on their own.
        run: |
          set -euo pipefail
          ref="$(echo '${{ steps.tags.outputs.tags }}' | cut -d, -f1)"
          echo "Smoking ${ref}"
          docker run --rm --entrypoint clink_node "${ref}" --help
          docker run --rm --entrypoint clink "${ref}" --help

      - name: The manifest really covers both architectures
        # The failure this guards is silent: if one arch's build dropped out,
        # the merge still succeeds and publishes a perfectly working
        # single-arch image. Nobody notices until someone on a laptop gets
        # an emulated one, or no image at all.
        run: |
          set -euo pipefail
          ref="$(echo '${{ steps.tags.outputs.tags }}' | cut -d, -f1)"
          arches="$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          echo "manifest covers: ${arches}"
          for want in linux/amd64 linux/arm64; do
            case " ${arches} " in
              *" ${want} "*) ;;
              *) echo "::error::${ref} does not cover ${want}"; exit 1 ;;
            esac
          done

      - name: The one-command example runs, on both architectures
        # The README's first command is a promise. It breaks quietly: the
        # example is copied in a build step, its data path is rewritten by a
        # sed, and the entrypoint has to route a subcommand rather than a
        # flag. Any of those can regress without a single test noticing, and
        # the person who finds out is someone trying clink for the first time.
        run: |
          set -euo pipefail
          ref="$(echo '${{ steps.tags.outputs.tags }}' | cut -d, -f1)"
          for platform in linux/amd64 linux/arm64; do
            echo "== ${platform} =="
            out="$(docker run --rm --platform "${platform}" "${ref}" \
                     run /opt/clink/examples/sql/hello.sql)"
            echo "${out}"
            echo "${out}" | grep -q '"region":"emea"' \
              || { echo "::error::the bundled example produced no rows on ${platform}"; exit 1; }
            # Results, not startup logs: the one-off path defaults to warn.
            if echo "${out}" | grep -q "coordinator.submit"; then
              echo "::error::the example printed engine logs over its results on ${platform}"
              exit 1
            fi
          done
