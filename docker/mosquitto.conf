# Mosquitto config for the MQTT connector live IT (docker/integration-services.yml).
# Plain, anonymous broker on 1883 - test-only, never a production config.
listener 1883
allow_anonymous true
# Every topic is open but one subtree, whose publishes the broker refuses, so
# the sink's live suite sees a refusal (docker/mosquitto.acl).
acl_file /mosquitto/config/mosquitto.acl
# A test's subscriber can fall behind a sink's burst (a restored job catching
# up publishes thousands of messages at once), and past the default queue of
# 1000 per client the broker drops messages, saying so only in its own log,
# which the test would read as the sink losing them.
max_queued_messages 1000000
