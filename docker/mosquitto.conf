# Mosquitto config for the MQTT connector live IT (docker/integration-services.yml).
# Plain, anonymous broker on 1883 - test-only, never a production config.
listener 1883
allow_anonymous true
# Every topic is open but one subtree, whose publishes the broker refuses, so
# the sink's live suite sees a refusal (docker/mosquitto.acl).
acl_file /mosquitto/config/mosquitto.acl
