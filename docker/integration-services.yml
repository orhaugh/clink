# Sidecar services for the connector LIVE integration tests. These tests are
# SKIPPED unless their endpoint env var is set, so the normal build/test run
# never needs this.
#
# The one-command path is scripts/run-all-live.sh. It does NOT bring all of these
# up at once - it builds clink once (no services running), then for EACH connector
# brings up ONLY that connector's service(s), runs its live tests, and tears them
# down before the next. So this compose file is the menu of services the runner
# draws from per connector, not a set to start together.
#
# Manual usage for ONE connector (host, published ports) - e.g. redis:
#   docker compose -f docker/integration-services.yml up -d --wait redis
#   export CLINK_REDIS_TEST_URL=redis://localhost:6379
#   ctest --test-dir build -R 'RedisLive|RedisUpsertSinkLive' --output-on-failure
#   docker compose -f docker/integration-services.yml rm -sf redis
# Or just run one connector through the orchestrator: ONLY=redis scripts/run-all-live.sh
#
# (LocalStack accepts any credentials; the dummy test/test keys the runner sets
#  just let the AWS SDK sign requests.)

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # plain http on 9200 for the test
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  localstack:
    image: localstack/localstack:3
    environment:
      - SERVICES=kinesis,s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Redis for the Redis Streams connector live IT.
  # URL: redis://localhost:6379
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  # Cassandra for the Cassandra connector live ITs (sink + changelog upsert sink).
  # CLINK_CASSANDRA_TEST_CONTACT_POINTS: "127.0.0.1"
  cassandra:
    image: cassandra:4
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT cluster_name FROM system.local"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # MySQL for the MySQL connector live ITs (both the cursor source/sink and the
  # binlog CDC source). The binlog flags enable replication: ROW format with full
  # before/after images and a server-id, so mysql_cdc_source can stream changes.
  # DSN: "host=localhost port=3306 user=root password=mysql database=test"
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: test
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Postgres with logical replication for the CDC source live IT.
  # DSN: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
  postgres-cdc:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # Enable two-phase commit (PREPARE TRANSACTION) for the postgres
      # exactly-once sink live IT; defaults to 0 (disabled).
      - -c
      - max_prepared_transactions=10
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Google Cloud Pub/Sub emulator for the Pub/Sub connector live IT. Speaks the
  # same REST API as the service; the test creates its own topic + subscription.
  # CLINK_PUBSUB_EMULATOR_HOST: "localhost:8085"
  pubsub:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  # MongoDB as a single-node REPLICA SET (the CDC change-stream source requires
  # one). scripts/run-all-live.sh runs rs.initiate after startup with the member
  # host set to the service DNS name, so the driver on the compose network
  # discovers it. CLINK_MONGODB_TEST_URI: "mongodb://mongodb:27017/?replicaSet=rs0"
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # NATS with JetStream enabled (the sink/source use JetStream streams).
  # Monitoring on 8222 gives a /healthz readiness probe (the nats image has no
  # shell, so no container healthcheck; run-all-live.sh probes /healthz).
  # CLINK_NATS_TEST_ENDPOINT: "nats://nats:4222"
  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # Mosquitto MQTT broker, anonymous plain 1883 (see docker/mosquitto.conf).
  # CLINK_MQTT_TEST_URL: "mqtt://mqtt:1883"
  mqtt:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  # InfluxDB 2.x for the influxdb sink live IT. Init mode pre-creates the org,
  # bucket and admin token the test defaults to (clink / clink / clink-token), so
  # no manual setup is needed. CLINK_INFLUXDB_TEST_ENDPOINT: "http://influxdb:8086"
  influxdb:
    image: influxdb:2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: clink
      DOCKER_INFLUXDB_INIT_PASSWORD: clink-password
      DOCKER_INFLUXDB_INIT_ORG: clink
      DOCKER_INFLUXDB_INIT_BUCKET: clink
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: clink-token
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # RabbitMQ for the AMQP source/sink live IT. The default 'guest' user is
  # loopback-only (a networked client is refused), so create a real user via
  # RABBITMQ_DEFAULT_USER/PASS that CAN connect remotely; the test uses it via
  # CLINK_RABBITMQ_TEST_USER/PASSWORD. CLINK_RABBITMQ_TEST_ENDPOINT: "rabbitmq"
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: clink
      RABBITMQ_DEFAULT_PASS: clink
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # Apache Pulsar standalone for the pulsar source/sink live IT. Topics are
  # auto-created on subscribe, so no admin setup is needed; -nfw/-nss drop the
  # functions worker + stream storage to speed startup. Admin REST on 8080 gives a
  # readiness probe. CLINK_PULSAR_TEST_ENDPOINT: "pulsar://pulsar:6650"
  pulsar:
    image: apachepulsar/pulsar:3.3.1
    command: ["bin/pulsar", "standalone", "-nfw", "-nss"]
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/admin/v2/brokers/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 20s

  # fake-gcs-server for the GCS Parquet live IT (Arrow GcsFileSystem, anonymous,
  # scheme=http). The test creates its own bucket. -public-host must match the
  # in-container authority so upload redirects resolve. CLINK_GCS_TEST_ENDPOINT: "gcs:4443"
  gcs:
    image: fsouza/fake-gcs-server
    command: ["-scheme", "http", "-host", "0.0.0.0", "-port", "4443", "-public-host", "gcs:4443"]
    ports:
      - "4443:4443"

  # Azurite (Azure Storage emulator) for the Azure Parquet live IT. Bind the blob
  # service on 0.0.0.0 so a networked client reaches it; the test uses Azurite's
  # well-known devstoreaccount1 account + key. CLINK_AZURE_TEST_ENDPOINT: "azurite:10000"
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: ["azurite", "--blobHost", "0.0.0.0", "--blobPort", "10000"]
    ports:
      - "10000:10000"

  # Single-container pseudo-distributed HDFS for the WebHDFS Parquet live IT. The
  # baked Cmd ends in an interactive bash (exits without a TTY), so override it to
  # start dfs and stay up. A fresh namenode boots in safemode; the readiness probe
  # in run-all-live.sh leaves safemode and ensures a writable /tmp. WebHDFS namenode
  # is on 50070, datanode 50075 (Hadoop 2.x). CLINK_WEBHDFS_TEST_ENDPOINT: "http://webhdfs:50070"
  webhdfs:
    image: mdouchement/hdfs
    hostname: webhdfs
    command: ["/bin/sh", "-c", "service ssh start && start-dfs.sh && tail -f /dev/null"]
    ports:
      - "50070:50070"
      - "50075:50075"

  # Apache Iceberg REST catalog (ASF fixture) for the iceberg REST + S3 live ITs.
  # It keeps the table pointers in an in-container SQLite catalog but its WAREHOUSE
  # is S3 (localstack) via S3FileIO, so metadata + data files land on S3 exactly as
  # a production REST+S3 lakehouse would. The clink test creates its own namespace +
  # table over REST. The warehouse bucket (clink-iceberg-rest) is pre-created by the
  # readiness probe. CLINK_ICEBERG_REST_URI: "http://iceberg-rest:8181"
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - CATALOG_WAREHOUSE=s3://clink-iceberg-rest/wh
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://localstack:4566
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/v1/config || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Single-node etcd v3 for the etcd HaCoordinator live IT (leader election over a
  # TTL'd lease + atomic Put). Client API on 2379 advertised on 0.0.0.0 so a
  # networked client reaches it. Needs no readiness probe beyond the healthcheck -
  # etcd does not double-start. CLINK_ETCD_ENDPOINT: "http://etcd:2379"
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - /usr/local/bin/etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=s1=http://0.0.0.0:2380
      - --initial-cluster-token=clink-etcd
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  # ClickHouse, one service per supported line, for the native sink's server pins
  # (impls/clickhouse/tests/test_clickhouse_pins_live.cpp, run by
  # scripts/clickhouse-pins.sh). Pinned by digest: a pin is a statement about one
  # build of the server. Each runs an embedded single-node Keeper so the pins can
  # create a ReplicatedMergeTree. CLINK_CLICKHOUSE_TEST_HOST=localhost and
  # CLINK_CLICKHOUSE_TEST_PORT=19103 (26.3) or 19108 (26.8).
  clickhouse-26-3:
    image: clickhouse/clickhouse-server:26.3@sha256:d030e8af10d90c42a373919fdffe843248716637d13b1f1331c1b8449b1e9919
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./clickhouse/pins/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./clickhouse/pins/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    ports:
      - "19103:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  clickhouse-26-8:
    image: clickhouse/clickhouse-server:26.8@sha256:3043f691ec1a847f38b446ff43708893fcbf9815bd9bd88c0f84bfe064ce852f
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./clickhouse/pins/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./clickhouse/pins/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    ports:
      - "19108:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # The same lines with a server-wide <merge_tree> async_insert=1, for the one pin
  # that needs it (P6): CLINK_CLICKHOUSE_TEST_ASYNC_DEFAULT=1, ports 19113 / 19118.
  clickhouse-26-3-async-default:
    image: clickhouse/clickhouse-server:26.3@sha256:d030e8af10d90c42a373919fdffe843248716637d13b1f1331c1b8449b1e9919
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./clickhouse/pins/merge-tree-async.xml:/etc/clickhouse-server/config.d/merge-tree-async.xml:ro
    ports:
      - "19113:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  clickhouse-26-8-async-default:
    image: clickhouse/clickhouse-server:26.8@sha256:3043f691ec1a847f38b446ff43708893fcbf9815bd9bd88c0f84bfe064ce852f
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./clickhouse/pins/merge-tree-async.xml:/etc/clickhouse-server/config.d/merge-tree-async.xml:ro
    ports:
      - "19118:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # The native sink's live suites (impls/clickhouse/tests/test_native_live.cpp,
  # run by scripts/clickhouse-live.sh), beyond the services above. 25.3 serves
  # only the legacy sink's round trip: CLINK_CLICKHOUSE_TEST_PORT=19203.
  clickhouse-25-3:
    image: clickhouse/clickhouse-server:25.3@sha256:b627d7a9bc0e0c1bac26cdbe9d2fc6316faa29c5d8a174f28f5abd57d0fa6ba2
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ports:
      - "19203:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # Two replicas of one shard per line, sharing a standalone Keeper, for the
  # failover suite and pin P18. Both replicas carry a <replicated_merge_tree>
  # async_insert=1 default (P18), so the failover target sets async_insert = 0
  # on the table. Native ports 19133 / 19143 (26.3) and 19138 / 19148 (26.8).
  clickhouse-keeper-26-3:
    image: clickhouse/clickhouse-keeper:26.3@sha256:e9ca270ad171e6fc55f2416916d4d581a7d7ad7242504a58fc6dedc1be91ab03
    volumes:
      - ./clickhouse/replicated/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-keeper-client -h localhost -p 9181 -q 'ls /' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 3s

  clickhouse-26-3-r1:
    image: clickhouse/clickhouse-server:26.3@sha256:d030e8af10d90c42a373919fdffe843248716637d13b1f1331c1b8449b1e9919
    hostname: clickhouse-26-3-r1
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLINK_CLICKHOUSE_KEEPER_HOST=clickhouse-keeper-26-3
      - CLINK_CLICKHOUSE_REPLICA=r1
    volumes:
      - ./clickhouse/replicated/replicated.xml:/etc/clickhouse-server/config.d/replicated.xml:ro
      - ./clickhouse/replicated/replicated-merge-tree-async.xml:/etc/clickhouse-server/config.d/replicated-merge-tree-async.xml:ro
    depends_on:
      clickhouse-keeper-26-3:
        condition: service_healthy
    ports:
      - "19133:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  clickhouse-26-3-r2:
    image: clickhouse/clickhouse-server:26.3@sha256:d030e8af10d90c42a373919fdffe843248716637d13b1f1331c1b8449b1e9919
    hostname: clickhouse-26-3-r2
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLINK_CLICKHOUSE_KEEPER_HOST=clickhouse-keeper-26-3
      - CLINK_CLICKHOUSE_REPLICA=r2
    volumes:
      - ./clickhouse/replicated/replicated.xml:/etc/clickhouse-server/config.d/replicated.xml:ro
      - ./clickhouse/replicated/replicated-merge-tree-async.xml:/etc/clickhouse-server/config.d/replicated-merge-tree-async.xml:ro
    depends_on:
      clickhouse-keeper-26-3:
        condition: service_healthy
    ports:
      - "19143:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  clickhouse-keeper-26-8:
    image: clickhouse/clickhouse-keeper:26.8@sha256:3deb4253a105188c3f5143da4029002ec273f0f6974e18e6cd96be0d48a688c2
    volumes:
      - ./clickhouse/replicated/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-keeper-client -h localhost -p 9181 -q 'ls /' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 3s

  clickhouse-26-8-r1:
    image: clickhouse/clickhouse-server:26.8@sha256:3043f691ec1a847f38b446ff43708893fcbf9815bd9bd88c0f84bfe064ce852f
    hostname: clickhouse-26-8-r1
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLINK_CLICKHOUSE_KEEPER_HOST=clickhouse-keeper-26-8
      - CLINK_CLICKHOUSE_REPLICA=r1
    volumes:
      - ./clickhouse/replicated/replicated.xml:/etc/clickhouse-server/config.d/replicated.xml:ro
      - ./clickhouse/replicated/replicated-merge-tree-async.xml:/etc/clickhouse-server/config.d/replicated-merge-tree-async.xml:ro
    depends_on:
      clickhouse-keeper-26-8:
        condition: service_healthy
    ports:
      - "19138:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  clickhouse-26-8-r2:
    image: clickhouse/clickhouse-server:26.8@sha256:3043f691ec1a847f38b446ff43708893fcbf9815bd9bd88c0f84bfe064ce852f
    hostname: clickhouse-26-8-r2
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLINK_CLICKHOUSE_KEEPER_HOST=clickhouse-keeper-26-8
      - CLINK_CLICKHOUSE_REPLICA=r2
    volumes:
      - ./clickhouse/replicated/replicated.xml:/etc/clickhouse-server/config.d/replicated.xml:ro
      - ./clickhouse/replicated/replicated-merge-tree-async.xml:/etc/clickhouse-server/config.d/replicated-merge-tree-async.xml:ro
    depends_on:
      clickhouse-keeper-26-8:
        condition: service_healthy
    ports:
      - "19148:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # 26.8 with the native protocol over TLS on 9440 (host 19458), beside the
  # plain port (host 19158) for setup. The certificate and key come from the
  # directory CLINK_CLICKHOUSE_TLS_DIR names, which
  # scripts/make-clickhouse-test-tls.sh generates per run for
  # scripts/clickhouse-live.sh and the wheels workflow (a CA, a server
  # certificate for localhost and 127.0.0.1, and a second CA that did not sign
  # it); without it the TLS port has no certificate and the server does not start.
  clickhouse-26-8-tls:
    image: clickhouse/clickhouse-server:26.8@sha256:3043f691ec1a847f38b446ff43708893fcbf9815bd9bd88c0f84bfe064ce852f
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./clickhouse/tls/tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro
      - ${CLINK_CLICKHOUSE_TLS_DIR:-./clickhouse/tls}:/etc/clickhouse-server/tls:ro
    ports:
      - "19158:9000"
      - "19458:9440"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
