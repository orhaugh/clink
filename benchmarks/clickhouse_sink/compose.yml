# ClickHouse for the native sink's benchmarks and the server-ceiling calibration.
# The server image is pinned by the digest the server pins run against
# (docker/integration-services.yml), and part_log is on for the soak's
# part-rate report. The client service is the same image, used for
# clickhouse-client and clickhouse-local; on a rig it runs on the client host.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8@sha256:3043f691ec1a847f38b446ff43708893fcbf9815bd9bd88c0f84bfe064ce852f
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./part-log.xml:/etc/clickhouse-server/config.d/part-log.xml:ro
    ports:
      - "19208:9000"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  client:
    image: clickhouse/clickhouse-server:26.8@sha256:3043f691ec1a847f38b446ff43708893fcbf9815bd9bd88c0f84bfe064ce852f
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./data:/data
