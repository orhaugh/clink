# The clink side of the sink benchmarks: one Coordinator and one Worker from the
# runtime image, plus a one-shot submit container that run.sh drives with
# `docker compose run`. Locally run.sh merges this file with compose.yml, so the
# Worker reaches ClickHouse as clickhouse:9000 on the project network; on a rig
# it is used alone on the clink host and the pipeline names the server host.
#
# The Worker reads the Parquet input from ./data and checkpoints into the
# volume it shares with the Coordinator. Sixty-four slots: the widest pipeline
# (the JSONEachRow sink, five operators at parallelism 8) needs forty.
services:
  clink-coordinator:
    image: ${CLINK_IMAGE:-clink-runtime:latest}
    command:
      - --role=coordinator
      - --port=6123
      - --bind-host=0.0.0.0
      - --advertise-host=clink-coordinator
      - --http-port=8081
      - --http-bind=0.0.0.0
    ports:
      - "${CLINK_HTTP_PORT:-19281}:8081"
    volumes:
      - clink-state:/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  clink-worker:
    image: ${CLINK_IMAGE:-clink-runtime:latest}
    depends_on:
      clink-coordinator:
        condition: service_healthy
    command:
      - --role=worker
      - --id=worker-1
      - --coordinator-host=clink-coordinator
      - --coordinator-port=6123
      - --data-host=clink-worker
      - --slots=64
      - --http-port=8082
      - --http-bind=0.0.0.0
    environment:
      CLINK_DATA_BIND_HOST: 0.0.0.0
      # The end-of-input checkpoint waits for every sink's last INSERT; the
      # default bound (30 s) is sized for tests, not for a final batch at volume.
      CLINK_EOS_FINAL_CKPT_TIMEOUT_MS: "600000"
    volumes:
      - clink-state:/state
      - ./data:/data:ro
    restart: "no"
    healthcheck:
      # 200 only once the Worker is registered with the Coordinator.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/api/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  # One-shot: run.sh passes `run /results/<campaign>/<trial>/pipeline.sql
  # --coordinator-host=... --parallelism=... --checkpoint-*`. It submits and exits.
  clink-submit:
    image: ${CLINK_IMAGE:-clink-runtime:latest}
    profiles: ["submit"]
    volumes:
      - ./results:/results:ro
    restart: "no"

volumes:
  clink-state:
