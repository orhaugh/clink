# Default values for the clink chart.

image:
  # The published clink runtime image (built from docker/Dockerfile.runtime by
  # .github/workflows/runtime-image.yml). Any cluster with internet access can
  # pull this; point repository at your own registry if you mirror it or build
  # the image yourself.
  repository: ghcr.io/orhaugh/clink-runtime
  # A released tag, published by runtime-image.yml on v0.15.0. `main` is also
  # available as the rolling build of the default branch, and `latest` tracks the
  # newest release - pin a version like this one for anything you care about
  # staying still.
  tag: "0.15.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra labels/annotations applied to every object.
commonLabels: {}
commonAnnotations: {}

# Bearer-token auth on every pod's HTTP API (CLINK_AUTH_TOKEN). The token comes
# from a Secret you create; existingSecret names it and secretKey its key. Every
# request then needs `Authorization: Bearer <token>`, except the probes
# (/livez, /readyz) and a mounted console's own files. Empty: no auth.
auth:
  existingSecret: ""
  secretKey: token

# Control-plane TLS between the Workers and the Coordinator(s). Each Secret is a
# kubernetes.io/tls Secret that also carries ca.crt (cert-manager's layout),
# and both are issued by one CA. The Coordinator's certificate must name every
# host a Worker connects to it by: without HA the Coordinator Service
# (<fullname>-coordinator), with HA each Coordinator's stable name, which
# *.<fullname>-coordinator-headless.<namespace>.svc.cluster.local covers.
tls:
  enabled: false
  # tls.crt and tls.key the Coordinator serves, ca.crt the CA that issued them.
  coordinatorSecret: ""
  # Mutual TLS: the Workers' client certificate (tls.crt, tls.key, ca.crt).
  # Empty: server-only TLS, the Workers verifying with the Coordinator
  # Secret's ca.crt alone (its key is never mounted on a Worker).
  workerSecret: ""
  # false passes --tls-no-verify-hostname: the CA must still have signed the
  # Coordinator's certificate, but the names in it are not checked.
  verifyHostname: true

serviceAccount:
  # Create a ServiceAccount for the pods. A future etcd/k8s-native HA mode that
  # uses leader election will need RBAC on this account.
  create: true
  name: ""
  annotations: {}

coordinator:
  # The control plane is a single leader. v1 runs ONE Coordinator (HA multi-coordinator
  # leader election is a documented follow-on - see ha below). Pinned to 1.
  controlPort: 6123
  httpPort: 8081
  # Serve the ops console the image carries at / on the HTTP port, beside the
  # API. false passes --no-console and / answers with a JSON signpost.
  console: true
  service:
    # ClusterIP keeps the dashboard in-cluster. Use NodePort/LoadBalancer (or an
    # Ingress) to expose http externally; the control port should stay internal.
    type: ClusterIP
    annotations: {}
  # Extra clink_node args, e.g. ["--heartbeat-timeout-ms=8000"].
  extraArgs: []
  # State backend URI passed as --state-backend (empty = node default). e.g.
  # "s3+rocksdb://bucket/prefix?..." for disaggregated state.
  stateBackend: ""
  # Extra environment, volumes and mounts for the Coordinator container, in
  # the Kubernetes shapes (EnvVar, EnvFromSource, Volume, VolumeMount).
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

worker:
  replicas: 3
  # Task slots per Worker (parallelism capacity).
  slots: 4
  httpPort: 8082
  extraArgs: []
  # Extra environment, volumes and mounts for the Worker container. A job's
  # connector secrets go here, e.g. extraEnvFrom: [{secretRef: {name: pg}}]
  # for a table that reads `password = 'env://PG_PASSWORD'`, and so does a
  # shared checkpoint volume outside the HA one.
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # How long to let an in-flight subtask drain on pod termination before SIGKILL.
  terminationGracePeriodSeconds: 30

# High availability: run multiple Coordinator replicas with leader election.
# The Coordinators become a StatefulSet behind a headless Service, so each has
# a stable name to advertise (and a TLS certificate can name it), and the
# Coordinator Service reaches any of them: a standby forwards the API to the
# leader, and /readyz admits a Coordinator once it leads or knows the leader.
#
# Uses clink's file-based HA backend (always compiled into clink_node, no extra
# dependency): every coordinator races an fcntl lock on a SHARED --ha-dir; the winner
# binds the control port and writes its endpoint to active-leader.json, standbys
# wait, and Workers discover the leader from that same shared dir. On
# leader death a standby acquires the lock and takes over.
#
# REQUIRES shared storage mounted by every coordinator and worker pod:
#   storage.type=pvc  : a ReadWriteMany PVC (production; needs an RWX-capable
#                       StorageClass - NFS/CephFS/etc). fcntl over a network FS
#                       carries a stale-lock risk under pathological hangs.
#   storage.type=hostPath: a node-local path shared by co-located pods. Correct
#                       ONLY on a single-node cluster (kind/minikube/dev).
#
# (The etcd coordinator is the more robust multi-machine election primitive but
# needs a clink_node built with -DCLINK_WITH_ETCD=ON + etcd-cpp-apiv3, which the
# default runtime image is not - so it is a documented follow-on, not wired here.)
ha:
  enabled: false
  # Coordinator replica count (the leader + standbys).
  replicas: 2
  storage:
    type: pvc            # pvc | hostPath
    mountPath: /var/lib/clink/ha
    pvc:
      # MUST be ReadWriteMany-capable for a real multi-node cluster.
      storageClassName: ""
      size: 1Gi
    hostPath:
      # Single-node only (kind/dev). All pods share this node path.
      path: /var/lib/clink-ha
