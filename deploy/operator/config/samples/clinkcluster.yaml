apiVersion: clink.dev/v1alpha1
kind: ClinkCluster
metadata:
  name: demo
spec:
  # These are the defaults; shown here so the sample is self-describing. `main`
  # is the rolling default-branch build - pin a released tag for anything
  # long-lived.
  image:
    repository: ghcr.io/orhaugh/clink-runtime
    tag: main
    pullPolicy: IfNotPresent
  coordinator:
    controlPort: 6123
    httpPort: 8081
  worker:
    replicas: 2
    slots: 4
    httpPort: 8082
  # ha:
  #   enabled: true
  #   replicas: 2
  #   type: pvc              # a ReadWriteMany claim, or hostPath on one node (kind)
  # checkpointStorage:       # shared, so a savepoint one pod writes another restores
  #   enabled: true
  #   type: pvc
  # A secured cluster: the HTTP API token, control-plane TLS (mutual with
  # workerSecret), and connector credentials for env:// options in SQL.
  # auth:
  #   existingSecret: clink-auth            # key "token"
  # tls:
  #   enabled: true
  #   coordinatorSecret: clink-tls-coordinator
  #   workerSecret: clink-tls-worker
  # worker:
  #   envFrom:
  #     - secretRef:
  #         name: connector-credentials
