# clink documentation site. Built by .github/workflows/docs.yml (MkDocs
# Material -> GitHub Pages) from the tracked subdirectories of docs/.
#
# docs/ also holds untracked internal work notes on developer machines, so
# exclude_docs is an allowlist mirroring .gitignore: only the tracked,
# published content can reach a build, even one run locally.

site_name: Clink — C++23 Stream Processing Engine
site_description: >-
  Clink is an embedded-first, Arrow-native C++23 stream processing engine with
  streaming SQL, event time, exactly-once checkpoints, stateful operators,
  distributed execution, and production connectors.
site_url: https://orhaugh.github.io/clink/
repo_url: https://github.com/orhaugh/clink
repo_name: orhaugh/clink
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

exclude_docs: |
  /*.md
  !/index.md
  !/capabilities.md
  !/benchmarks.md
  !/efficiency.md
  !/sql.md
  /*/
  !/guides/
  !/internals/
  !/connectors/
  !/design/
  !/consumer-examples/
  !/qualification/
  !/assets/
  consumer-examples/build/

validation:
  links:
    unrecognized_links: info
    absolute_links: info

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Guides:
      - C++ stream processing engine: guides/cpp-stream-processing.md
      - Streaming SQL in C++: guides/cpp-streaming-sql.md
      - Clink vs Apache Flink: guides/clink-vs-flink.md
      - Arrow-native stream processing: guides/arrow-stream-processing.md
  - Capabilities: capabilities.md
  - SQL: sql.md
  - Benchmarks: benchmarks.md
  - Qualification:
