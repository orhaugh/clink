\* TLC configuration for trace validation. The constants are read off the
\* trace itself (operators in TraceExactlyOnce.tla); the trace file is named
\* by CLINK_TRACE_FILE in TLC's environment. scripts/formal-check.sh --trace
\* runs this.
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
POSTCONDITION TraceAccepted
CONSTANTS
    Sinks <- TraceSinks
    Workers <- TraceWorkers
    Host <- TraceHost
    SrcWorker <- TraceSrcWorker
    MaxCkpt <- TraceMaxCkpt
    MaxInFlight <- TraceMaxInFlight
    Recoverable <- TraceRecoverable
    MaxWorkerDeaths <- TraceMaxWorkerDeaths
    MaxCoordDeaths <- TraceMaxCoordDeaths
    MaxExpiries <- TraceMaxExpiries
    MaxSnapFails <- TraceMaxSnapFails
    MaxBrokerOutages <- TraceMaxBrokerOutages
    MaxWalkCancels <- TraceMaxWalkCancels
    Bug = "none"
INVARIANTS
    TypeOK
    NoDuplicate
    NoLoss
    FrontierCovered
    RestoreSound
    ConfirmedMeansCommitted
    Fenced
