# The MongoDB orders example: a single-member replica set (change streams need
# one) and, for a run from the published runtime image, a Coordinator, a Worker
# and the one-shot submission of pipeline.sql. run.sh drives it; with
# CLINK_BIN_DIR it starts only MongoDB and runs clink from a local build.

services:
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27018}:27017"
    volumes:
      - ./scripts:/scripts:ro
    # Initiates the replica set on the first probe and reports healthy once this
    # member is primary.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 5s

  coordinator:
    image: ${CLINK_IMAGE:-ghcr.io/orhaugh/clink-runtime:latest}
    profiles: [image]
    command:
      - --role=coordinator
      - --port=6123
      - --bind-host=0.0.0.0
      - --advertise-host=coordinator
      - --http-port=8081
      - --http-bind=0.0.0.0
      - --ha-dir=/state/ha
    ports:
      - "127.0.0.1:${CLINK_HTTP_PORT:-8081}:8081"
    volumes:
      - clink-state:/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  worker:
    image: ${CLINK_IMAGE:-ghcr.io/orhaugh/clink-runtime:latest}
    profiles: [image]
    depends_on:
      coordinator:
        condition: service_healthy
    command:
      - --role=worker
      - --id=worker-1
      - --coordinator-host=coordinator
      - --coordinator-port=6123
      - --data-host=worker
      - --slots=16
      - --http-port=8082
      - --http-bind=0.0.0.0
    environment:
      CLINK_DATA_BIND_HOST: 0.0.0.0
      # Read by the tables' uri='env://MONGODB_URI'.
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
    volumes:
      - clink-state:/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/api/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  submit:
    image: ${CLINK_IMAGE:-ghcr.io/orhaugh/clink-runtime:latest}
    profiles: [image]
    volumes:
      - ./pipeline.sql:/pipeline.sql:ro
    command:
      - run
      - /pipeline.sql
      - --coordinator-host=coordinator
      - --coordinator-port=8081
      - --name=mongodb-orders
      - --checkpoint-dir=/state/checkpoints
      - --checkpoint-interval-ms=2000
    restart: "no"

volumes:
  clink-state:
