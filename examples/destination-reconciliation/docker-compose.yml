# The services the destination-reconciliation example runs against: one Kafka
# broker and one ClickHouse server, both on 127.0.0.1 only. clink itself runs
# on the host from a local build (run.sh), because the example drives its
# fault points, which only a test build compiles in.
#
# Disposable: run.sh brings it up with a project name of its own and removes
# it, volumes included, when it ends. Everything it corrupts on purpose is in
# this ClickHouse, never in a destination of yours.
name: ${COMPOSE_PROJECT_NAME:-clink-reconcile-demo}

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # kafka:9092 inside the network (the console tools), and a listener the
      # host's clink reaches on 127.0.0.1.
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:${KAFKA_PORT:-29192},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:${KAFKA_PORT:-29192}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29192}:${KAFKA_PORT:-29192}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 10s

  clickhouse:
    # A line the native sink is tested on, pinned by digest.
    image: clickhouse/clickhouse-server:26.8@sha256:3043f691ec1a847f38b446ff43708893fcbf9815bd9bd88c0f84bfe064ce852f
    environment:
      # The administrator the example sets up and corrupts its disposable
      # tables with. The job writes as `clink` and the reconciliation reads as
      # `reconciler`, users run.sh creates with only the grants each needs.
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-29100}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password admin --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
