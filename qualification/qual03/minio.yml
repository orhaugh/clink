# QUAL-03 sink object store.
#
# Runs on the ops host, outside the clink failure domain, so a fault
# aimed at clink never takes the oracle's evidence store with it. The
# s3_unavailable fault pauses THIS container by name; the store's own
# availability is a scheduled fault, never collateral.
#
# MinIO, not LocalStack, for the same reason the local gate switched:
# LocalStack's CompleteMultipartUpload is not atomic, so the duplicate
# in-flight completes that recovery legitimately produces can overwrite a
# committed object with a zero-byte one - a store artefact that reads as
# an engine defect. MinIO serialises the complete like real S3.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: qual03-minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command:
      - server
      - /data
    ports:
      - "9000:9000"
    volumes:
      - qual03-minio-data:/data
volumes:
  qual03-minio-data:
