# The qualification rig's clink coordinator.
#
# restart: no - deliberately. The chaos controller SIGKILLs this process
# and measures what the cluster does next; a docker auto-restart would
# resurrect it before the failure had any observable consequence and the
# campaign would prove nothing about HA recovery. The controller brings
# it back explicitly, and that restart is a recorded chaos action.
#
# CONTROL_IP is this node's private address, advertised to workers.
services:
  clink-coordinator:
    image: ${CLINK_IMAGE:-ghcr.io/orhaugh/clink-runtime:main}
    container_name: clink-coordinator
    network_mode: host
    command:
      - --role=coordinator
      - --port=6123
      - --bind-host=0.0.0.0
      - --advertise-host=${CONTROL_IP}
      - --http-port=8095
      - --http-bind=0.0.0.0
      # Without this the coordinator persists no job manifests, so a
      # coordinator that dies takes every running job with it and comes
      # back empty. QUAL-01's re-run demonstrated exactly that: a 2PC
      # fault point crashed the coordinator, it restarted clean, and the
      # pipeline never resumed - which the oracle then reported as 1.6
      # million missing results. Nothing was lost or corrupted; the job
      # had simply ceased to exist. Killing a control plane that was
      # never configured to survive it measures the configuration, not
      # the engine.
      #
      # Deliberately a LOCAL path, not the NFS-shared /qual/state: the
      # ha-dir doubles as the leader-election lock, and the coordinator
      # refuses leadership when it cannot verify the filesystem honours
      # locks (NFS being the case it has in mind) unless told to accept
      # that risk. The container restarts on its own host, so a local
      # directory survives exactly the failure being injected without
      # asking for an unsafe lock.
      - --ha-dir=/qual/ha
      # How long the coordinator waits for a restart's subtasks to wind
      # down before it gives up and FAILS the job. The 120s default suits
      # a job whose operators hold state in memory; it does not suit one
      # whose every key access is a round trip to a state store, where a
      # subtask takes correspondingly longer to drain. QUAL-04 measured
      # exactly that: "restart drain timed out; failing job" with seven
      # subtasks undrained, on a deferring backend running at its store's
      # write ceiling. Scales with the backend, so the campaign sets it.
      - --restart-drain-timeout-ms=${RESTART_DRAIN_TIMEOUT_MS:-120000}
    environment:
      # Armed per-restart by the chaos controller for targeted 2PC-window
      # faults; empty in normal operation.
      CLINK_FAULT_INJECT: ${CLINK_FAULT_INJECT:-}
    volumes:
      - /qual/state:/qual/state
      - /qual/ha:/qual/ha
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8095/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 40
