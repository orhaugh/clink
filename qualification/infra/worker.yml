# One clink worker of the qualification rig's three.
#
# restart: no. A deliberate worker SIGKILL must remain observable until the
# chaos controller records and restarts it. Coordinator failure is different:
# the worker container stays up and its in-process supervisor replaces only the
# fenced control session.
#
# WORKER_IP is this node's private address - the address PEERS dial for
# data. A container hostname is meaningless to a worker on another host,
# and localhost would silently make every cross-node edge fail.
services:
  clink-worker:
    image: ${CLINK_IMAGE:-ghcr.io/orhaugh/clink-runtime:main}
    container_name: clink-worker
    network_mode: host
    command:
      - --role=worker
      - --id=${WORKER_ID}
      - --coordinator-host=${CONTROL_IP}
      - --coordinator-port=6123
      - --data-host=${WORKER_IP}
      - --slots=${CLINK_SLOTS:-16}
      # A fallback floor for recovery: with the default of 1 retained
      # checkpoint, an Incomplete newest checkpoint (item 75c) strands the
      # restore with nothing older to verify. Three keeps two rungs of
      # history at negligible cost for campaign state sizes.
      - --checkpoint-num-retained=${CLINK_CHECKPOINT_RETAINED:-3}
      - --http-port=8082
      - --http-bind=0.0.0.0
    environment:
      CLINK_DATA_BIND_HOST: 0.0.0.0
      CLINK_FAULT_INJECT: ${CLINK_FAULT_INJECT:-}
      # Object-store credentials for campaigns whose sink is S3-compatible
      # (QUAL-03's MinIO). Empty for every other campaign; the metadata
      # disable stops the SDK probing a cloud IMDS endpoint that either
      # does not exist or answers for the wrong account.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-true}
    volumes:
      - /qual/state:/qual/state
    restart: "no"
